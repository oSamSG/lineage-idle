        </div>
      </div>`;
  };

  Game.viewInventory=function(){
    const inv=this.state?.inventory||{}, eq=eqSet();
    const rows=Object.entries(inv).sort((a,b)=>{const da=DB.items[a[1].id]||{},db=DB.items[b[1].id]||{};return String(da.type||'').localeCompare(String(db.type||''),'zh-Hant')||String(da.name||'').localeCompare(String(db.name||''),'zh-Hant');}).map(([key,it])=>{
      const d=DB.items[it.id]||{}, equipped=eq.has(key), buttons=[];
      if(isEquip(d)&&!equipped) buttons.push(`<button class="btn green" data-equip="${esc(key)}">裝備</button>`,`<button class="btn" data-enchant="${esc(key)}">強化</button>`);
      if(d.type==='potion'||d.type==='book'||d.type==='exp_potion') buttons.push(`<button class="btn green" data-use="${esc(key)}">使用</button>`);
      if(!equipped) buttons.push(`<button class="btn red" data-manual-sell="${esc(key)}">賣出</button>`); else buttons.push('<span class="pill">裝備中</span>');
      const nm=this.itemName?this.itemName(key):`${Number(it.enchant)||0?`+${Number(it.enchant)} `:''}${d.name||it.id}${Number(it.qty)>1?' ×'+it.qty:''}`;
      const tag=d.type==='scroll'?'<span class="pill c-gold">卷軸：僅手動賣出</span>':(this.isSellRuleMatched(key)?'<span class="pill c-red">符合目前自動規則</span>':'');
      return `<div class="item row"><span><b class="rarity-${esc(d.rarity||'白')}">${esc(nm)}</b> ${tag}<br><span class="small">${esc(typeName(d.type))}｜${esc(d.rarity||'白')}｜販售 ${money(sellPrice(key))} 金幣</span></span><span>${buttons.join(' ')}</span></div>`;
    }).join('')||'<div class="small">背包是空的</div>';
    const panel=`<div class="setting-card" style="margin-bottom:10px"><b class="c-gold">V1.2.12 販售規則</b><div class="row" style="flex-wrap:wrap;justify-content:flex-start;margin-top:8px"><button class="btn red" data-batch-sell="rule">依目前自動規則清理</button><button class="btn red" data-batch-sell="white">販售白色未裝備</button><button class="btn red" data-batch-sell="learnedBooks">販售已學技能書</button><button class="btn red" data-batch-sell="unequippedEquip">販售全部未裝備裝備</button></div><div class="small">自動設定可分別控制「未裝備裝備」與「已學技能書」。卷軸不進入任何自動/批次/智能清理規則。</div></div>`;
    return `<h3 class="title">背包</h3>${panel}${rows}`;
  };

  const oldRender=Game.renderTab?.bind(Game);
  Game.renderTab=function(){
    if(oldRender) oldRender();
    setVersion();
    const el=document.getElementById('tabContent'); if(!this.state||!el) return;
    if(this.tab==='settings') el.innerHTML=this.viewSettings();
    if(this.tab==='inventory') el.innerHTML=this.viewInventory();
    el.querySelectorAll('[data-sell]').forEach(btn=>btn.removeAttribute('data-sell'));
    el.querySelectorAll('[data-sell-all],[data-smart-clean]').forEach(btn=>btn.remove());
    el.querySelectorAll('[data-setting]').forEach(x=>x.onchange=()=>{const k=x.dataset.setting;let v=x.type==='checkbox'?x.checked:(x.type==='number'?+x.value:x.value);this.state.settings[k]=v;if(k==='autoTransform'&&v&&v!=='none')this.transform(v);this.save?.(false);this.render?.();});
    el.querySelectorAll('[data-skill-toggle]').forEach(x=>x.onchange=()=>{let id=x.dataset.skillToggle;let arr=this.state.settings.autoSkills||[];if(x.checked&&!arr.includes(id))arr.push(id);if(!x.checked)arr=arr.filter(v=>v!==id);this.state.settings.autoSkills=arr;this.state.settings.autoSkill=arr[0]||'none';this.save?.(false);this.render?.();});
    el.querySelectorAll('[data-manual-sell]').forEach(btn=>btn.onclick=e=>{e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();this.sellItem(btn.dataset.manualSell);});
    el.querySelectorAll('[data-batch-sell]').forEach(btn=>btn.onclick=e=>{e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();this.batchSell(btn.dataset.batchSell);});
    el.querySelectorAll('[data-equip]').forEach(btn=>btn.onclick=()=>this.equip(btn.dataset.equip));
    el.querySelectorAll('[data-use]').forEach(btn=>btn.onclick=()=>this.useItem(btn.dataset.use));
    el.querySelectorAll('[data-enchant]').forEach(btn=>btn.onclick=()=>this.enchant(btn.dataset.enchant));
  };

  // 確保擊殺後依照新選項執行，不回到舊的白裝固定規則。
  const oldKill=Game.kill?.bind(Game);
  Game.kill=function(mdef){
    const beforeInv=Object.keys(this.state?.inventory||{}).length;
    oldKill(mdef);
    ensureSettings(this);
    // 若舊 kill 已呼叫 sellWhite，這裡再依目前規則補一次；沒有符合項目時 silent 不刷訊息。
    if(this.state?.settings?.autoSell && Object.keys(this.state?.inventory||{}).length>=0) this.sellByCurrentRule({silent:true});
  };
  setVersion();
})();

/* === lineage_Idle_V1.3 Rebuilt Sell System ===
   完整重建販售系統：
   - 卷軸永遠排除自動 / 批次 / 智能清理規則，但可手動單件賣出。
   - 自動販售支援：未裝備裝備、強化值門檻、已學技能書。
   - 移除舊白裝規則與舊 data-sell 入口干擾。
*/
(()=>{
  if(!window.Game || !window.DB) return;
  const VERSION='lineage_Idle_V1.3';
  const EQUIP_TYPES=new Set(['weapon','helmet','tshirt','armor','cloak','gloves','boots','leggings','ring','earring','amulet','belt']);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=n=>Math.max(0,Math.floor(Number(n)||0)).toLocaleString();
  const itemDef=it=>DB.items?.[it?.id]||{};
  const isEquipDef=d=>!!d && EQUIP_TYPES.has(d.type);
  const typeLabel=t=>({weapon:'武器',helmet:'頭盔',tshirt:'內衣',armor:'盔甲',cloak:'斗篷',gloves:'手套',boots:'鞋子',leggings:'脛甲',ring:'戒指',earring:'耳環',amulet:'項鍊',belt:'腰帶',potion:'藥水',scroll:'卷軸',book:'技能書',material:'材料',exp_potion:'經驗藥水'}[t]||t||'物品');
  const equipSet=g=>new Set(Object.values(g.state?.equip||{}).filter(Boolean));
  const qtyOf=it=>Math.max(1,Number(it?.qty)||1);
  const enchantOf=it=>Math.max(0,Number(it?.enchant)||0);

  function setVersion(){
    document.title=VERSION;
    document.querySelectorAll('#start h1,.top .title').forEach(el=>{el.textContent=VERSION;});
  }

  function ensureSettings(g){
    if(!g.state) return {};
    const s=g.state.settings=g.state.settings||{};
    if(s.hpLimit===undefined) s.hpLimit=45;
    if(s.autoBoss===undefined) s.autoBoss=true;
    if(s.autoSkill===undefined) s.autoSkill='none';
    if(!Array.isArray(s.autoSkills)) s.autoSkills=s.autoSkill&&s.autoSkill!=='none'?[s.autoSkill]:[];
    if(s.autoBuyPotion===undefined) s.autoBuyPotion=false;
    if(s.autoBuyPotionId===undefined) s.autoBuyPotionId='potion_red';
    if(s.autoBuyPotionQty===undefined) s.autoBuyPotionQty=50;
    if(s.autoTransform===undefined) s.autoTransform='none';

    // V1.3 新販售設定。保留 autoSell 名稱避免舊存檔不相容。
    if(s.autoSell===undefined) s.autoSell=false;
    if(s.autoSellEquip===undefined) s.autoSellEquip=true;
    if(s.autoSellBooks===undefined) s.autoSellBooks=true;
    if(s.sellEnchantLimit===undefined) s.sellEnchantLimit=6;

    // 清除舊規則欄位，避免舊白裝/類型規則復活。
    delete s.sellRarity;
    delete s.sellType;
    delete s.sellFilter;
    delete s.sellMode;
    delete s.sellScroll;
    delete s.autoSellScroll;
    return s;
  }

  function getSellPrice(g,key){
    const it=g.state?.inventory?.[key];
    if(!it) return 0;
    const d=itemDef(it);
    return Math.max(1,Math.floor((Number(d.price)||100)*(0.35+enchantOf(it)*0.2)))*qtyOf(it);
  }

  function manualSell(g,key,{silent=false}={}){
    const inv=g.state?.inventory||{};
    const it=inv[key];
    if(!it){ if(!silent) g.log?.('販售失敗：背包內找不到該物品。','red'); return 0; }
    if(equipSet(g).has(key)){ if(!silent) alert('已裝備中的物品不能賣出，請先卸下。'); return 0; }
    const d=itemDef(it);
    const gain=getSellPrice(g,key);
    const qty=qtyOf(it);
    g.state.adena=(Number(g.state.adena)||0)+gain;
    delete inv[key];
    if(!silent) g.log?.(`賣出 ${d.name||it.id}${qty>1?' ×'+qty:''}，獲得 ${money(gain)} 金幣。`,'green');
    return gain;
  }

  function matchAutoSellRule(g,key){
    const it=g.state?.inventory?.[key];
    if(!it) return false;
    const d=itemDef(it);
    const s=ensureSettings(g);
    if(equipSet(g).has(key)) return false;
    if(d.type==='scroll') return false; // V1.3 核心：卷軸永遠排除自動規則
    if(isEquipDef(d)) return !!s.autoSellEquip && enchantOf(it)<=Number(s.sellEnchantLimit||0);
    if(d.type==='book') return !!s.autoSellBooks && !!g.state?.skills?.[d.skill];
    return false;
  }

  function runAutoSell(g,{silent=false}={}){
    ensureSettings(g);
    let count=0,total=0;
    for(const key of Object.keys(g.state?.inventory||{})){
      const it=g.state.inventory[key];
      const d=itemDef(it);
      if(d.type==='scroll') continue;
      if(!matchAutoSellRule(g,key)) continue;
      count+=qtyOf(it);
      total+=manualSell(g,key,{silent:true});
    }
    if(!silent){
      g.log?.(count?`自動販售完成：賣出 ${count} 件，獲得 ${money(total)} 金幣。`:'自動販售完成：沒有符合規則的物品。',count?'green':undefined);
    }
    return {count,total};
  }

  function itemName(g,key){
    const it=g.state?.inventory?.[key];
    if(!it) return '';
    const d=itemDef(it);
    return `${enchantOf(it)>0?`+${enchantOf(it)} `:''}${d.name||it.id}${qtyOf(it)>1?' ×'+qtyOf(it):''}`;
  }

  function renderSettings(g){
    const s=ensureSettings(g);
    const learnedSkills=Object.keys(g.state?.skills||{}).map(id=>[id,DB.skills[id]?.name||id,DB.skills[id]?.type||'',DB.skills[id]?.mp||0]);
    const transforms=Object.values(DB.transforms||{}).filter(t=>t.id==='none'||g.state.lv>=t.lv);
    const potionIds=['potion_red','potion_orange','potion_clear'].filter(id=>DB.items[id]);
    return `<h3 class="title">自動設定</h3>
      <div class="small">V1.3 已重建販售系統：卷軸永遠不進入自動、批次、智能清理規則；卷軸只能在背包單件手動賣出。</div>
      <div class="setting-grid">
        <div class="setting-card">
          <b class="c-gold">戰鬥</b>
          <label class="row item"><span>自動喝水 HP%</span><input data-setting="hpLimit" type="number" min="1" max="99" value="${Number(s.hpLimit)||45}" style="width:90px"></label>
          <label class="row item"><span>自動挑戰 BOSS</span><input data-setting="autoBoss" type="checkbox" ${s.autoBoss?'checked':''}></label>
          <div class="item"><b>自動施放技能（可多選）</b><br>${learnedSkills.length?learnedSkills.map(x=>`<label class="pill"><input type="checkbox" data-skill-toggle="${esc(x[0])}" ${s.autoSkills.includes(x[0])?'checked':''}> ${esc(x[1])} <span class="small">MP${esc(x[3])} / ${esc(x[2])}</span></label>`).join(' '):'<span class="small">尚未學會可用技能</span>'}</div>
        </div>
        <div class="setting-card">
          <b class="c-gold">背包 / V1.3 自動販售</b>
          <label class="row item"><span>啟用自動販售</span><input data-setting="autoSell" type="checkbox" ${s.autoSell?'checked':''}></label>
          <label class="row item"><span>自動賣未裝備裝備</span><input data-setting="autoSellEquip" type="checkbox" ${s.autoSellEquip?'checked':''}></label>
          <label class="row item"><span>裝備強化值 ≤</span><input data-setting="sellEnchantLimit" type="number" min="0" max="20" value="${Number(s.sellEnchantLimit)||0}" style="width:90px"></label>
          <label class="row item"><span>自動賣已學技能書</span><input data-setting="autoSellBooks" type="checkbox" ${s.autoSellBooks?'checked':''}></label>
          <div class="row" style="flex-wrap:wrap;justify-content:flex-start;margin:8px 0">
            <button class="btn red" data-v13-batch="rule">依目前自動規則清理</button>
            <button class="btn red" data-v13-batch="equip">立即賣未裝備裝備</button>
            <button class="btn red" data-v13-batch="book">立即賣已學技能書</button>
          </div>
          <div class="small">保留規則：卷軸、藥水、未學技能書、已裝備物品、強化值高於門檻的裝備。</div>
        </div>
        <div class="setting-card">
          <b class="c-gold">自動補給 / 變身</b>
          <label class="row item"><span>藥水不足自動購買</span><input data-setting="autoBuyPotion" type="checkbox" ${s.autoBuyPotion?'checked':''}></label>
          <label class="row item"><span>購買藥水</span><select data-setting="autoBuyPotionId">${potionIds.map(id=>`<option value="${id}" ${s.autoBuyPotionId===id?'selected':''}>${esc(DB.items[id].name)}</option>`).join('')}</select></label>
          <label class="row item"><span>補到數量</span><input data-setting="autoBuyPotionQty" type="number" min="1" max="999" value="${Number(s.autoBuyPotionQty)||50}" style="width:90px"></label>
          <label class="row item"><span>預設變身</span><select data-setting="autoTransform">${transforms.map(t=>`<option value="${esc(t.id)}" ${s.autoTransform===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label>
        </div>
      </div>`;
  }

  function renderInventory(g){
    ensureSettings(g);
    const inv=g.state?.inventory||{};
    const eq=equipSet(g);
    const rows=Object.entries(inv).sort((a,b)=>{
      const da=itemDef(a[1]), db=itemDef(b[1]);
      return String(da.type||'').localeCompare(String(db.type||''),'zh-Hant') || String(da.name||'').localeCompare(String(db.name||''),'zh-Hant');
    }).map(([key,it])=>{
      const d=itemDef(it);
      const equipped=eq.has(key);
      const buttons=[];
      if(isEquipDef(d) && !equipped) buttons.push(`<button class="btn green" data-equip="${esc(key)}">裝備</button>`,`<button class="btn" data-enchant="${esc(key)}">強化</button>`);
      if(['potion','book','exp_potion'].includes(d.type)) buttons.push(`<button class="btn green" data-use="${esc(key)}">使用</button>`);
      if(!equipped) buttons.push(`<button class="btn red" data-v13-sell="${esc(key)}">賣出</button>`); else buttons.push('<span class="pill">裝備中</span>');
      const tag=d.type==='scroll'?'<span class="pill c-gold">卷軸：不自動賣</span>':(matchAutoSellRule(g,key)?'<span class="pill c-red">符合自動規則</span>':'');
      return `<div class="item row"><span><b class="rarity-${esc(d.rarity||'白')}">${esc(itemName(g,key))}</b> ${tag}<br><span class="small">${esc(typeLabel(d.type))}｜${esc(d.rarity||'白')}｜販售 ${money(getSellPrice(g,key))} 金幣</span></span><span>${buttons.join(' ')}</span></div>`;
    }).join('') || '<div class="small">背包是空的</div>';
    const panel=`<div class="setting-card" style="margin-bottom:10px"><b class="c-gold">V1.3 販售規則</b><div class="row" style="flex-wrap:wrap;justify-content:flex-start;margin-top:8px"><button class="btn red" data-v13-batch="rule">依目前自動規則清理</button><button class="btn red" data-v13-batch="equip">販售未裝備裝備</button><button class="btn red" data-v13-batch="book">販售已學技能書</button></div><div class="small">批次按鈕同樣永遠排除卷軸。</div></div>`;
    return `<h3 class="title">背包</h3>${panel}${rows}`;
  }

  function batchSell(g,mode){
    let count=0,total=0;
    ensureSettings(g);
    for(const key of Object.keys(g.state?.inventory||{})){
      const it=g.state.inventory[key];
      const d=itemDef(it);
      if(equipSet(g).has(key) || d.type==='scroll') continue;
      let ok=false;
      if(mode==='rule') ok=matchAutoSellRule(g,key);
      if(mode==='equip') ok=isEquipDef(d) && enchantOf(it)<=Number(g.state.settings.sellEnchantLimit||0);
      if(mode==='book') ok=d.type==='book' && !!g.state?.skills?.[d.skill];
      if(!ok) continue;
      count+=qtyOf(it);
      total+=manualSell(g,key,{silent:true});
    }
    g.log?.(count?`批次販售完成：賣出 ${count} 件，獲得 ${money(total)} 金幣。`:'批次販售完成：沒有符合規則的物品。',count?'green':undefined);
    g.render?.();
  }

  // 核心覆寫
  Game.ensureSellSettingsV13=function(){return ensureSettings(this);};
  Game.isSellRuleMatched=function(key){return matchAutoSellRule(this,key);};
  Game.sellItem=function(key){manualSell(this,key,{silent:false}); this.save?.(false); this.render?.();};
  Game.sellWhite=function(){return this.state?.settings?.autoSell ? runAutoSell(this,{silent:true}) : {count:0,total:0};};
  Game.sellByCurrentRule=function(opts){return runAutoSell(this,opts||{});};
  Game.smartSell=Game.sellByCurrentRule;
  Game.autoClean=Game.sellByCurrentRule;
  Game.batchSell=function(mode){return batchSell(this,mode);};
  Game.viewSettings=function(){return renderSettings(this);};
  Game.viewInventory=function(){return renderInventory(this);};

  const oldMigrate=Game.migrateState?.bind(Game);
  Game.migrateState=function(){ if(oldMigrate) oldMigrate(); if(this.state){this.state.version='1.3'; ensureSettings(this);} setVersion(); };
  const oldBase=Game.baseState?.bind(Game);
  if(oldBase){
    Game.baseState=function(cls){const s=oldBase(cls); s.version='1.3'; this.state=s; ensureSettings(this); return s;};
  }

  // 擊殺流程重建：經驗值大幅降低，並只呼叫 V1.3 自動販售。
  Game.kill=function(mdef){
    const m=this.map();
    const ad=this.rand(mdef.adena[0],mdef.adena[1]);
    const expGain=Math.max(1,Math.floor((Number(mdef.exp)||1)*0.15));
    this.state.adena+=ad;
    this.state.exp+=expGain;
    this.blog?.(`擊敗 ${mdef.name}，EXP +${expGain}，金幣 +${ad}`);
    m.drops.forEach(d=>{if(Math.random()*100<d.rate){this.addItem(d.id,1,0);this.log?.('獲得道具：'+DB.items[d.id].name,'green');}});
    this.levelUp?.();
    this.storyEncounter?.(mdef);
    this.state.monster=null;
    ensureSettings(this);
    if(this.state.settings.autoSell) runAutoSell(this,{silent:true});
  };

  const oldRenderTab=Game.renderTab?.bind(Game);
  Game.renderTab=function(){
    setVersion();
    const el=document.getElementById('tabContent');
    if(!this.state || !el){ if(oldRenderTab) oldRenderTab(); return; }
    if(this.tab==='settings') el.innerHTML=this.viewSettings();
    else if(this.tab==='inventory') el.innerHTML=this.viewInventory();
    else if(oldRenderTab) oldRenderTab();

    // 移除任何舊販售入口，避免舊規則攔截。
    el.querySelectorAll('[data-sell],[data-sell-all],[data-smart-clean]').forEach(btn=>{
      btn.removeAttribute('data-sell');
      btn.removeAttribute('data-sell-all');
      btn.removeAttribute('data-smart-clean');
    });

    el.querySelectorAll('[data-setting]').forEach(x=>x.onchange=()=>{
      const k=x.dataset.setting;
      const v=x.type==='checkbox'?x.checked:(x.type==='number'?Number(x.value):x.value);
      ensureSettings(this);
      this.state.settings[k]=v;
      if(k==='autoTransform'&&v&&v!=='none') this.transform(v);
      this.save?.(false);
      this.render?.();
    });
    el.querySelectorAll('[data-skill-toggle]').forEach(x=>x.onchange=()=>{
      const id=x.dataset.skillToggle;
      let arr=this.state.settings.autoSkills||[];
      if(x.checked&&!arr.includes(id)) arr.push(id);
      if(!x.checked) arr=arr.filter(v=>v!==id);
      this.state.settings.autoSkills=arr;
      this.state.settings.autoSkill=arr[0]||'none';
      this.save?.(false);
      this.render?.();
    });
    el.querySelectorAll('[data-v13-sell]').forEach(btn=>btn.onclick=e=>{e.preventDefault();e.stopPropagation();this.sellItem(btn.dataset.v13Sell);});
    el.querySelectorAll('[data-v13-batch]').forEach(btn=>btn.onclick=e=>{e.preventDefault();e.stopPropagation();this.batchSell(btn.dataset.v13Batch);});
    el.querySelectorAll('[data-equip]').forEach(btn=>btn.onclick=()=>this.equip(btn.dataset.equip));
    el.querySelectorAll('[data-use]').forEach(btn=>btn.onclick=()=>this.useItem(btn.dataset.use));
    el.querySelectorAll('[data-enchant]').forEach(btn=>btn.onclick=()=>this.enchant(btn.dataset.enchant));
    el.querySelectorAll('[data-unequip]').forEach(btn=>btn.onclick=()=>this.unequip(btn.dataset.unequip));
    el.querySelectorAll('[data-buy]').forEach(btn=>btn.onclick=()=>this.buy(btn.dataset.buy));
    el.querySelectorAll('[data-transform]').forEach(btn=>btn.onclick=()=>this.transform(btn.dataset.transform));
  };

  // 隱藏舊「未賣出目前規則」殘留訊息。
  const oldLog=Game.log?.bind(Game);
  if(oldLog){
    Game.log=function(msg,color){
      const t=String(msg??'');
      if(t.includes('未賣出') && (t.includes('目前規則') || t.includes('卷軸'))) return;
      return oldLog(msg,color);
    };
  }

  if(Game.state) ensureSettings(Game);
  setVersion();
})();



// === Hotfix Sam: restore original EXP gain and remove auction god-gear ===
(function(){
  if(!window.Game || !window.DB) return;

  function removeAuctionTab(){
    const tabs=document.getElementById('tabs');
    if(!tabs) return;
    tabs.querySelectorAll('[data-tab="auction"]').forEach(b=>b.remove());
    if(Game.tab==='auction'){
      Game.tab='inventory';
      if(Game.renderTab) Game.renderTab();
    }
  }

  function cleanAuctionText(html){
    return String(html||'')
      .replace(/、?拍賣場/g,'')
      .replace(/拍賣場、?/g,'')
      .replace(/或拍賣場取得/g,'取得')
      .replace(/、高階紅裝/g,'')
      .replace(/高階紅裝、?/g,'');
  }

  const oldMigrate=Game.migrateState ? Game.migrateState.bind(Game) : null;
  Game.migrateState=function(){
    if(oldMigrate) oldMigrate();
    if(this.state){
      this.state.version='1.3';
      delete this.state.auction;
    }
  };

  const oldInitMenus=Game.initMenus ? Game.initMenus.bind(Game) : null;
  Game.initMenus=function(){
    if(oldInitMenus) oldInitMenus();
    removeAuctionTab();
  };

  const oldRenderTab=Game.renderTab ? Game.renderTab.bind(Game) : null;
  Game.renderTab=function(){
    removeAuctionTab();
    if(this.tab==='auction') this.tab='inventory';
    if(oldRenderTab) oldRenderTab();
    removeAuctionTab();
  };

  if(Game.viewShop){
    const oldViewShop=Game.viewShop.bind(Game);
    Game.viewShop=function(){ return cleanAuctionText(oldViewShop()); };
  }
  if(Game.viewMaps){
    const oldViewMaps=Game.viewMaps.bind(Game);
    Game.viewMaps=function(){ return cleanAuctionText(oldViewMaps()); };
  }

  Game.refreshAuction=function(){ alert('拍賣場功能已移除。'); };
  Game.buyAuction=function(){ alert('拍賣場功能已移除。'); };
  Game.sellAuction=function(){ alert('拍賣場功能已移除。'); };
  Game.viewAuction=function(){ return '<h3 class="title">拍賣場已移除</h3><div class="small">此版本已移除拍賣場與神裝購買功能。</div>'; };

  // Restore original monster EXP gain: use monster base EXP directly instead of the reduced 15% multiplier.
  Game.kill=function(mdef){
    if(!mdef) return;
    const m=this.map ? this.map() : null;
    const ad=this.rand ? this.rand(mdef.adena[0],mdef.adena[1]) : Math.floor(mdef.adena[0]);
    const expGain=Math.max(1,Math.floor(Number(mdef.exp)||1));
    this.state.adena+=ad;
    this.state.exp+=expGain;
    if(this.blog) this.blog(`擊敗 ${mdef.name}，EXP +${expGain}，金幣 +${ad}`);
    if(m && Array.isArray(m.drops)){
      m.drops.forEach(d=>{
        if(Math.random()*100<d.rate){
          this.addItem(d.id,1,0);
          if(this.log) this.log('獲得道具：'+(DB.items[d.id]?.name||d.id),'green');
        }
      });
    }
    if(this.levelUp) this.levelUp();
    if(this.storyEncounter) this.storyEncounter(mdef);
    this.state.monster=null;
    if(this.state.settings && (this.state.settings.autoSell || this.state.settings.autoSellEnabled)){
      if(typeof runAutoSell==='function') runAutoSell(this,{silent:true});
      else if(this.autoSellInventory) this.autoSellInventory();
    }
  };

  setTimeout(removeAuctionTab,0);
  setTimeout(removeAuctionTab,250);
})();

</script>
