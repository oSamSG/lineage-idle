<div id="start" class="modal">
  <div class="panel modal-card">
    <h1 class="title" style="font-size:42px;text-align:center;margin:20px 0 8px">lineage_Idle_V1.3</h1>
    <p class="small" style="text-align:center;margin-bottom:24px">單機版</p>
    <div class="grid">
      <button id="newGame" class="btn green" style="font-size:22px;padding:14px">新冒險</button>
      <button id="loadGame" class="btn blue" style="font-size:22px;padding:14px">讀取存檔</button>
      <button id="importBtn" class="btn" style="font-size:18px;padding:12px">匯入存檔 JSON</button>
      <input id="importFile" type="file" accept="application/json,.json" class="hidden">
    </div>
  </div>
</div>

<div id="classModal" class="modal hidden">
  <div class="panel modal-card">
    <h2 class="title">選擇職業</h2>
    <div id="classList" class="grid classes"></div>
    <div class="row" style="margin-top:14px"><button id="backStart" class="btn">返回</button><button id="confirmClass" class="btn green" disabled>開始遊戲</button></div>
  </div>
</div>

<div class="app hidden" id="app">
  <div class="panel top">

    <div class="row"><button class="btn blue" id="saveBtn">儲存</button><button class="btn" id="exportBtn">匯出</button><button class="btn red" id="resetBtn">刪除</button></div>
  </div>
  <div class="main">
    <div class="col">
      <div class="panel">

        <div>HP<div class="bar"><i id="hpBar" class="hp"></i><span id="hpTxt"></span></div></div>

        <div>EXP<div class="bar"><i id="expBar" class="exp"></i><span id="expTxt"></span></div></div>
        <div class="stat" id="statBox" style="margin-top:10px"></div>
      </div>
      <div class="panel hidden" id="legacyAutoPanel">

        <input id="autoSell" type="checkbox">
        <input id="autoBoss" type="checkbox">
        <select id="autoSkill"></select>
      </div>
      <div class="panel scroll" style="flex:1"><div class="title">系統紀錄</div><div id="sysLog" class="log"></div></div>
    </div>

    <div class="col">
      <div class="panel">
        <div class="tabs" id="tabs"></div>
      </div>
      <div class="panel scroll" style="flex:1">
        <div id="tabContent"></div>
      </div>
    </div>

    <div class="col">

      <div class="panel scroll" style="flex:1"><div class="title">戰鬥紀錄</div><div id="battleLog" class="log"></div></div>

  </div>
</div>

 ];

  migrateState(){oldMigrate();let s=this.state;if(!s)return;s.version=VERSION;s.party=s.party||{members:{}};s.offline=s.offline||{enabled:true,lastActive:Date.now(),totalSec:0};if(!s.settings)s.settings={};if(s.settings.offlineEnabled===undefined)s.settings.offlineEnabled=true;},

  initMenus(){oldInitMenus();let tabs=document.getElementById('tabs');if(tabs&&!tabs.querySelector('[data-tab="party"]')){let btn=document.createElement('button');btn.className='btn tab';btn.dataset.tab='party';btn.textContent='隊伍/組隊';btn.onclick=()=>{this.tab='party';this.renderTab();};let before=tabs.querySelector('[data-tab="dungeon"]')||tabs.querySelector('[data-tab="pet"]')||tabs.children[3];tabs.insertBefore(btn,before||null);}},
  save(show){if(this.state){this.state.offline=this.state.offline||{};this.state.offline.lastActive=Date.now();}oldSave(show);},
  tick(){oldTick();if(this.state){this.state.offline=this.state.offline||{};this.state.offline.lastActive=Date.now();if(!this._v34AutoSaveAt||Date.now()-this._v34AutoSaveAt>15000){this._v34AutoSaveAt=Date.now();Store.save(this.state);}}},
  applyOffline(){oldApplyOffline();let s=this.state;if(!s||s.settings?.offlineEnabled===false)return;let last=s.offline?.lastActive||s.lastSave||Date.now();let sec=Math.min(86400,Math.max(0,Math.floor((Date.now()-last)/1000)));if(sec<30)return;let cycles=Math.floor(sec/5);let stLv=s.lv||1;let partyBonus=Object.values(s.party?.members||{}).filter(Boolean).length*0.18;let petBonus=s.activePet?0.12:0;let guildBonus=s.guild?.name?Math.min(0.25,(s.guild.level||1)*0.025):0;let multiplier=1+partyBonus+petBonus+guildBonus;
   let expGain=Math.floor(cycles*(stLv*7+25)*multiplier);let adenaGain=Math.floor(cycles*(stLv*14+60)*multiplier);let kills=Math.floor(cycles*0.7*multiplier);
   s.exp=(s.exp||0)+expGain;s.adena=(s.adena||0)+adenaGain;s.v3Stats=s.v3Stats||{};s.v3Stats.kills=(s.v3Stats.kills||0)+kills;s.v3Stats.adenaEarned=(s.v3Stats.adenaEarned||0)+adenaGain;s.offline.totalSec=(s.offline.totalSec||0)+sec;s.offline.lastActive=Date.now();this.levelUp();this.log(`離線掛機：${Math.floor(sec/60)} 分鐘，EXP +${expGain.toLocaleString()}，金幣 +${adenaGain.toLocaleString()}，模擬擊殺 +${kills}`,'green');Store.save(s);},
  equip(key){let it=this.invItem(key),d=it?DB.items[it.id]:null;if(d?.type==='weapon'&&this.state.lv<reqLvOf(it.id)){alert(`${d.name} 需要 Lv.${reqLvOf(it.id)} 才能裝備。`);return;}oldEquip(key);},
  buy(id){let d=DB.items[id];if(d?.type==='weapon'&&this.state.lv<reqLvOf(id)){alert(`${d.name} 是 Lv.${reqLvOf(id)} 武器，目前等級不能購買，避免買了不能用。`);return;}oldBuy(id);},
  recruitParty(id){let p=partyDefs.find(x=>x.id===id);if(!p)return;if(this.state.lv<p.lv){alert('等級不足，需要 Lv.'+p.lv);return}if(!this.state.party.members[id]){if(this.state.adena<p.cost){alert('金幣不足');return}this.state.adena-=p.cost;this.state.party.members[id]=true;this.log('隊友加入：'+p.name,'green');}this.render();},
  dismissParty(id){if(this.state.party?.members?.[id]){delete this.state.party.members[id];this.log('隊友暫離隊伍。');this.render();}},
  fight(){oldFight();let mon=this.mon();if(!mon||mon.hp<=0)return;let mdef=DB.mons[mon.id];let members=partyDefs.filter(p=>this.state.party?.members?.[p.id]);if(!members.length)return;let total=0;for(let p of members){let dmg=p.dmg+Math.floor(this.state.lv*0.45)+(mdef.boss?Math.floor((p.crit||0)*1.6):0);mon.hp-=dmg;total+=dmg;if(p.heal&&Math.random()<0.35)this.state.hp=Math.min(this.maxHp(),this.state.hp+p.heal);}this.blog(`隊伍協同攻擊 ${mdef.name}，造成 <span class="c-purple">${total}</span> 傷害。`);if(mon.hp<=0)this.kill(mdef);},
  renderTab(){oldRenderTab();let el=document.getElementById('tabContent');if(!this.state||!el)return;if(this.tab==='party'){el.innerHTML=this.viewParty();el.querySelectorAll('[data-recruit-party]').forEach(b=>b.onclick=()=>this.recruitParty(b.dataset.recruitParty));el.querySelectorAll('[data-dismiss-party]').forEach(b=>b.onclick=()=>this.dismissParty(b.dataset.dismissParty));}},
  viewParty(){let active=partyDefs.filter(p=>this.state.party?.members?.[p.id]);let bossDmg=active.reduce((a,p)=>a+p.dmg+Math.floor(this.state.lv*0.45)+Math.floor((p.crit||0)*1.6),0);let rows=partyDefs.map(p=>{let own=!!this.state.party?.members?.[p.id],lock=this.state.lv<p.lv;return `<div class="item row"><span><b class="${own?'c-gold':''}">${p.name}</b> <span class="pill">${p.role}</span><br><span class="small">需求 Lv.${p.lv}｜招募 ${p.cost.toLocaleString()} 金幣｜打王輸出約 ${p.dmg+Math.floor(this.state.lv*0.45)+Math.floor((p.crit||0)*1.6)} / 回合<br>${p.desc}</span></span><span>${own?`<button class="btn red" data-dismiss-party="${p.id}">離隊</button>`:`<button class="btn green" data-recruit-party="${p.id}" ${lock?'disabled':''}>招募</button>`}</span></div>`}).join('');return `<h3 class="title">隊伍 / 組隊打王</h3><div class="small">單機版無法真正同步雙開視窗，所以改為內建隊友系統。招募後，隊友會在戰鬥中自動協同攻擊，對 BOSS 特別有用。</div><div class="setting-card"><b class="c-gold">目前隊伍</b><br><span class="small">隊友 ${active.length}/5｜打王額外輸出約 ${bossDmg.toLocaleString()} / 回合｜離線收益加成 +${Math.floor(active.length*18)}%</span></div>${rows}`;},
  viewSettings(){let html=oldViewSettings();let checked=this.state.settings?.offlineEnabled!==false?'checked':'';return html+`<div class="setting-card" style="margin-top:10px"><b class="c-gold">離線掛機</b><label class="row item"><span>啟用離線收益</span><input data-setting="offlineEnabled" type="checkbox" ${checked}></label><div class="small">離開目前視窗、瀏覽器節流或關閉後，下次讀取會依離線時間模擬經驗、金幣與擊殺。上限 24 小時。</div></div>`;}
 });

 const priceOf=id=>{let d=DB.items[id]||{},base=d.price||100,lv=reqLv(id),r=rank[d.rarity]||1;if(d.type==='potion')return base;if(d.type==='scroll')return Math.ceil(base*1.05/100)*100;if(d.type==='book'){let sk=DB.skills[d.skill]||{};return Math.ceil((3200+Math.pow(sk.lv||1,1.5)*390*(sk.job==='general'?1:1.25))/100)*100;}if(d.type==='weapon')return Math.ceil((base+lv*lv*70+r*2200)/100)*100;if(eqTypes.includes(d.type))return Math.ceil((base+lv*lv*45+r*1600)/100)*100;return base;};
 const statLine=d=>{let p=[];if(d.reqLv)p.push('Lv.'+d.reqLv);if(d.rarity)p.push(d.rarity);if(d.weapon)p.push(d.weapon);if(d.dmg)p.push('傷害 '+d.dmg);if(d.ac!==undefined)p.push('AC '+d.ac);if(d.heal)p.push('HP +'+d.heal);for(let [k,v] of Object.entries(d.stat||{}))p.push(`${k.toUpperCase()} ${v>0?'+':''}${v}`);if(d.skill&&DB.skills[d.skill]){let s=DB.skills[d.skill];p.push(s.type);p.push('MP '+s.mp);}return p.join('｜')||'一般道具';};
 const oldMigrate=Game.migrateState.bind(Game);
 const oldRenderTab=Game.renderTab.bind(Game);
 Object.assign(Game,{
  migrateState(){oldMigrate();if(this.state)this.state.version=VERSION;},
  buy(id){let d=DB.items[id];if(!d)return;let price=priceOf(id);if(d.type==='weapon'&&!canUseWeapon(this,d)){alert(`${this.cls().name} 不能使用 ${d.name}。`);return;}if(this.state.lv<reqLv(id)){alert(`${d.name} 建議/需求 Lv.${reqLv(id)}，目前等級先不要購買，避免買了不能用。`);return;}if(d.type==='book'&&this.state.skills?.[d.skill]){alert('已學會此技能，不需要重複購買。');return;}if(this.state.adena<price){alert('金幣不足');return;}this.state.adena-=price;this.addItem(id,1,0);this.log(`購買 ${d.name}，花費 ${price.toLocaleString()} 金幣。`,'green');this.render();},
  equip(key){let it=this.invItem(key),d=it&&DB.items[it.id];if(!d)return;if(d.type==='weapon'){if(!canUseWeapon(this,d)){alert(`${this.cls().name} 不能裝備 ${d.name}。`);return;}if(this.state.lv<reqLv(it.id)){alert(`${d.name} 需要 Lv.${reqLv(it.id)} 才能裝備。`);return;}}else if(eqTypes.includes(d.type)&&this.state.lv<reqLv(it.id)){alert(`${d.name} 需要 Lv.${reqLv(it.id)} 才能裝備。`);return;}let original=this.invItem(key);if(!original)return;key=this.splitOne(key);let slot=d.type;if(d.type==='ring')slot=!this.state.equip.ring1?'ring1':(!this.state.equip.ring2?'ring2':'ring1');if(d.type==='earring')slot=!this.state.equip.earring1?'earring1':(!this.state.equip.earring2?'earring2':'earring1');this.state.equip[slot]=key;if(this.state.inventory[key])this.state.inventory[key].qty=1;this.log('已裝備 '+d.name,'green');this.render();},
  viewShop(){let html=`<h3 class="title">商店</h3><div class="small">已重排武器與防具進度：商店販售前中期可用裝備；終局紅裝仍由高階地圖、副本、拍賣場取得。未達需求等級或職業不能用的武器不建議購買。</div>`;for(let cat of shopCats){let entries=[];if(cat.dynamic==='books')entries=Object.values(DB.items).filter(d=>d.type==='book'&&canShowBook(this,d)).sort((a,b)=>(DB.skills[a.skill]?.lv||1)-(DB.skills[b.skill]?.lv||1)||a.name.localeCompare(b.name)).map(d=>d.id);else entries=cat.items.filter(id=>DB.items[id]);if(!entries.length)continue;html+=`<h3 class="title" style="margin-top:18px">${cat.title}</h3><div class="small">${cat.note||''}</div>`;for(let id of entries){let d=DB.items[id];let locked=this.state.lv<reqLv(id)||(d.type==='weapon'&&!canUseWeapon(this,d));let learned=d.type==='book'&&this.state.skills?.[d.skill];html+=`<div class="item row"><span class="rarity-${d.rarity}"><b>${d.name}</b><br><span class="small">${statLine(d)}${d.type==='weapon'&&!canUseWeapon(this,d)?'｜本職不可用':''}${learned?'｜已學會':''}</span></span><span><b class="c-gold">${priceOf(id).toLocaleString()}</b> <button class="btn ${locked||learned?'':'green'}" data-buy="${id}" ${locked||learned?'disabled':''}>購買</button></span></div>`;}}
   html+=`<h3 class="title" style="margin-top:18px">終局裝備來源</h3><div class="small">死亡騎士烈炎劍、屠龍劍、沙哈之弓、毀滅戰斧、龍槍、大法師魔杖、龍甲、龍戒、神話耳環等主要從傲慢高層、拉斯塔巴德、四龍地圖、副本、製作與拍賣場取得。</div>`;return html;},
  viewMaps(){return DB.maps.map(m=>`<div class="item"><b class="c-gold">${m.name}</b> <span class="pill">Lv.${m.min}-${m.max}</span><br><span class="small">怪物：${m.monsters.map(id=>DB.mons[id].name).join('、')}</span><br><span class="small">掉落：${m.drops.map(d=>{let it=DB.items[d.id];return it?`${it.name}${it.reqLv?`(Lv.${it.reqLv})`:''}`:d.id}).join('、')}</span></div>`).join('')},
  renderTab(){oldRenderTab();let el=document.getElementById('tabContent');if(!this.state||!el)return;if(this.tab==='shop'){el.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>this.buy(b.dataset.buy));}}
 });
})();



/* =========================================================
   Enchant System Upgrade Patch
   - 獨立強化頁
   - 武卷 / 祝武 / 防卷 / 祝防 / 飾品卷選擇
   - 安定值與成功率顯示
   - 強化紀錄與基礎
   ========================================================= */
(()=>{
 const VERSION='5.3';
 document.title='lineage_Idle_V1.3';
 document.querySelectorAll('.title').forEach(el=>{if(el.textContent.includes('lineage_Idle'))el.textContent='lineage_Idle_V1.3';});
 const startTitle=document.querySelector('#start h1'); if(startTitle)startTitle.textContent='lineage_Idle_V1.3';
 const topTitle=document.querySelector('.top .title'); if(topTitle)topTitle.textContent='lineage_Idle_V1.3';
 const loadBtn=document.getElementById('loadGame'); if(loadBtn)loadBtn.textContent='讀取存檔';

 const EQUIP_TYPES=['weapon','helmet','tshirt','armor','cloak','gloves','boots','leggings','ring','earring','amulet','belt'];
 const ARMOR_TYPES=['helmet','tshirt','armor','cloak','gloves','boots','leggings'];
 const ACC_TYPES=['ring','earring','amulet','belt'];
 const SCROLLS={
   normal_weapon:{id:'scroll_weapon',label:'武卷強化',short:'武卷',bonus:0,desc:'一般武器強化卷軸。'},
   bless_weapon:{id:'scroll_bless_weapon',label:'祝武強化',short:'祝武',bonus:.18,desc:'受祝福武器卷軸，超安定後成功率較高。'},
   normal_armor:{id:'scroll_armor',label:'防卷強化',short:'防卷',bonus:0,desc:'一般防具強化卷軸。'},
   bless_armor:{id:'scroll_bless_armor',label:'祝防強化',short:'祝防',bonus:.18,desc:'受祝福防具卷軸，超安定後成功率較高。'},
   accessory:{id:'scroll_accessory',label:'飾品強化',short:'飾品卷',bonus:0,desc:'飾品專用卷軸。'}
 };
 const rank={'白':1,'綠':2,'藍':3,'紫':4,'橘':5,'紅':6};
 const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
 const isEq=d=>d&&EQUIP_TYPES.includes(d.type);
 const isWeapon=d=>d&&d.type==='weapon';
 const isArmor=d=>d&&ARMOR_TYPES.includes(d.type);
 const isAcc=d=>d&&ACC_TYPES.includes(d.type);
 const scrollCount=(game,id)=>Object.values(game.state.inventory||{}).filter(x=>x.id===id).reduce((a,x)=>a+(x.qty||1),0);
 const findScrollKey=(game,id)=>Object.keys(game.state.inventory||{}).find(k=>game.state.inventory[k].id===id);
 const scrollModeFor=(d,bless=false)=>isWeapon(d)?(bless?'bless_weapon':'normal_weapon'):isArmor(d)?(bless?'bless_armor':'normal_armor'):isAcc(d)?'accessory':null;
 const safeOf=d=>d?.safe??(isWeapon(d)?6:isArmor(d)?4:0);
 const rateOf=(d,enchant,mode)=>{
   const safe=safeOf(d), over=Math.max(0,(enchant||0)-safe+1);
   if(over<=0)return 1;
   if(isWeapon(d)){
     const table=[.66,.45,.30,.18,.12,.08,.05];
     let r=table[Math.min(over-1,table.length-1)];
     if(mode==='bless_weapon')r=Math.min(.95,r+(SCROLLS.bless_weapon.bonus||0));
     return Math.max(.03,r);
   }
   if(isArmor(d)){
     const table=[.70,.50,.30,.15,.10,.07,.04];
     let r=table[Math.min(over-1,table.length-1)];
     if(mode==='bless_armor')r=Math.min(.95,r+(SCROLLS.bless_armor.bonus||0));
     return Math.max(.03,r);
   }
   if(isAcc(d)){
     const table=[.75,.55,.38,.24,.15,.09,.05];
     return Math.max(.03,table[Math.min(over-1,table.length-1)]);
   }
   return 0;
 };
 const powerBy=(game,key)=>game.itemPowerByKey?game.itemPowerByKey(key):0;
 const statLine=(game,key)=>game.statLineForKey?game.statLineForKey(key):'';
 const itemHtml=(game,key)=>{
   const it=game.invItem(key),d=it&&DB.items[it.id]; if(!d)return '';
   const safe=safeOf(d),ench=it.enchant||0,equipped=Object.values(game.state.equip||{}).includes(key);
   return `<b class="rarity-${d.rarity}">${game.itemName(key)}</b> ${equipped?'<span class="pill">裝備中</span>':''}<br><span class="small">${game.typeName(d.type)}｜安定值 +${safe}｜目前 +${ench}｜戰力 ${powerBy(game,key)}${statLine(game,key)?'｜'+statLine(game,key):''}</span>`;
 };
 const maxEnchant=(game)=>Object.values(game.state.inventory||{}).filter(x=>DB.items[x.id]&&EQUIP_TYPES.includes(DB.items[x.id].type)).reduce((m,x)=>Math.max(m,x.enchant||0),0);
 const oldInitMenus=Game.initMenus.bind(Game);
 const oldRenderTab=Game.renderTab.bind(Game);
 const oldMigrate=Game.migrateState.bind(Game);
 const oldAddItem=Game.addItem.bind(Game);
 const oldKill=Game.kill.bind(Game);

 Object.assign(Game,{
   migrateState(){oldMigrate();if(!this.state)return;this.state.version=VERSION;this.state.enchantLog=this.state.enchantLog||[];this.state.stats2=this.state.stats2||{};this.state.stats2.enchantTry=this.state.stats2.enchantTry||0;this.state.stats2.enchantSuccess=this.state.stats2.enchantSuccess||0;},
   initMenus(){oldInitMenus();let tabs=document.getElementById('tabs');if(tabs&&!tabs.querySelector('[data-tab="enchant"]')){let btn=document.createElement('button');btn.className='btn tab';btn.dataset.tab='enchant';btn.textContent='強化';btn.onclick=()=>{this.tab='enchant';this.renderTab();};let before=tabs.querySelector('[data-tab="refine"]')||tabs.querySelector('[data-tab="equipment"]')?.nextSibling;tabs.insertBefore(btn,before||null);}},
   addItem(id,qty=1,enchant=0){oldAddItem(id,qty,enchant);},
   kill(mdef){oldKill(mdef); if(mdef&&mdef.boss){
      const bonusDrops=[['scroll_bless_weapon',8.0],['scroll_bless_armor',9.0],['scroll_accessory',6.0]];
      bonusDrops.forEach(([id,rate])=>{if(DB.items[id]&&Math.random()*100<rate){this.addItem(id,1,0);this.log('BOSS 額外掉落：'+DB.items[id].name,'green');}});
   }},
   enchant(key){this.tab='enchant';this.state.ui=this.state.ui||{};this.state.ui.enchantTarget=key;this.render();},
   canEnchantKey(key){let it=this.invItem(key),d=it&&DB.items[it.id];return !!(it&&isEq(d));},
   chooseEnchantTarget(key){if(!this.canEnchantKey(key)){alert('此道具不能強化');return;}this.state.ui=this.state.ui||{};this.state.ui.enchantTarget=key;this.render();},
   enchantModesForKey(key){let it=this.invItem(key),d=it&&DB.items[it.id];if(!d)return[];if(isWeapon(d))return ['normal_weapon','bless_weapon'];if(isArmor(d))return ['normal_armor','bless_armor'];if(isAcc(d))return ['accessory'];return[];},
   doEnchant(key,mode){
     if(!this.canEnchantKey(key)){alert('此道具不能強化');return;}
     let it=this.invItem(key),d=DB.items[it.id],m=SCROLLS[mode];
     if(!m){alert('卷軸種類錯誤');return;}
     if(!this.enchantModesForKey(key).includes(mode)){alert('此卷軸不能用在這個裝備類型');return;}
     let scrollKey=findScrollKey(this,m.id);
     if(!scrollKey){alert('沒有 '+(DB.items[m.id]?.name||m.short));return;}
     let oldEnchant=it.enchant||0,rate=rateOf(d,oldEnchant,mode),success=Math.random()<rate;
     let equippedSlots=Object.keys(this.state.equip||{}).filter(s=>this.state.equip[s]===key);
     this.removeItem(scrollKey,1);
     this.state.stats2=this.state.stats2||{};this.state.stats2.enchantTry=(this.state.stats2.enchantTry||0)+1;
     let log={time:Date.now(),item:d.name,before:oldEnchant,mode:m.short,rate:Math.round(rate*100),success};
     if(success){
       this.state.stats2.enchantSuccess=(this.state.stats2.enchantSuccess||0)+1;
       let next=oldEnchant+1;
       this.removeItem(key,1);
       this.addItem(it.id,1,next);
       let newKey=Object.keys(this.state.inventory).find(k=>this.state.inventory[k].id===it.id&&this.state.inventory[k].enchant===next&&!Object.values(this.state.equip||{}).includes(k));
       equippedSlots.forEach(s=>this.state.equip[s]=newKey);
       this.state.ui=this.state.ui||{};this.state.ui.enchantTarget=newKey;
       log.after=next;
       this.log(`${m.short}：${d.name} +${oldEnchant} → +${next} 強化成功。成功率 ${Math.round(rate*100)}%`,'green');
       if(next>=9)this.log(`<span class="c-gold">高強化達成：+${next} ${d.name}</span>`,'green');
     }else{
       this.removeItem(key,1);
       this.state.ui=this.state.ui||{};this.state.ui.enchantTarget=null;
       log.destroyed=true;
       this.log(`${m.short}：${d.name} +${oldEnchant} 強化失敗，裝備消失。成功率 ${Math.round(rate*100)}%`,'red');
     }
     this.state.enchantLog=this.state.enchantLog||[];this.state.enchantLog.unshift(log);this.state.enchantLog=this.state.enchantLog.slice(0,60);
     this.save(false);this.render();
   },
   viewEnchant(){
     this.state.ui=this.state.ui||{};
     const rows=Object.entries(this.state.inventory||{}).filter(([k])=>this.canEnchantKey(k)).sort((a,b)=>{
       let da=DB.items[a[1].id],db=DB.items[b[1].id];return (rank[db.rarity]||0)-(rank[da.rarity]||0)||(b[1].enchant||0)-(a[1].enchant||0)||da.name.localeCompare(db.name);
     });
     let target=this.state.ui.enchantTarget;if(!target||!this.canEnchantKey(target))target=rows[0]?.[0]||null;
     this.state.ui.enchantTarget=target;
     const list=rows.map(([k,it])=>`<div class="item row"><span>${itemHtml(this,k)}</span><span><button class="btn ${k===target?'green':''}" data-enchant-target="${k}">${k===target?'選取中':'選擇'}</button></span></div>`).join('')||'<div class="small">沒有可強化裝備。</div>';
     let panel='';
     if(target){
       let it=this.invItem(target),d=DB.items[it.id],modes=this.enchantModesForKey(target),safe=safeOf(d),ench=it.enchant||0;
       let modeRows=modes.map(mode=>{let m=SCROLLS[mode],count=scrollCount(this,m.id),rate=rateOf(d,ench,mode),over=ench>=safe;return `<div class="item row"><span><b class="c-gold">${m.label}</b> <span class="pill">持有 ${count}</span><br><span class="small">${m.desc}｜${over?'超過安定值':'安定內'}｜成功率 ${Math.round(rate*100)}%</span></span><span><button class="btn ${count?'green':''}" data-enchant-do="${mode}" data-key="${target}" ${count?'':'disabled'}>強化</button></span></div>`;}).join('');
       panel=`<div class="setting-card"><h3 class="title">目標裝備</h3><div class="item">${itemHtml(this,target)}</div><div class="small">安定值 +${safe}。目前 +${ench}，${ench<safe?'仍在安定值內，成功率 100%。':'已超過安定值，失敗會消失。'}</div>${modeRows}</div>`;
     }
     let tryN=this.state.stats2?.enchantTry||0,suc=this.state.stats2?.enchantSuccess||0;
     let logs=(this.state.enchantLog||[]).slice(0,15).map(x=>`<div class="item"><span class="${x.success?'c-green':'c-red'}">${new Date(x.time).toLocaleString()}｜${x.mode}｜${x.item} +${x.before}${x.success?' → +'+x.after:' 失敗消失'}｜${x.rate}%</span></div>`).join('')||'<div class="small">尚無強化紀錄。</div>';
     return `<h3 class="title">裝備強化</h3><div class="small">可手動選擇武卷、祝武、防卷、祝防或飾品卷。祝福卷軸不再被系統自動吃掉，會顯示成功率與安定值。</div><div class="setting-grid"><div class="setting-card"><b class="c-gold">強化統計</b><div class="stat" style="margin-top:8px"><div>嘗試 ${tryN}</div><div>成功 ${suc}</div><div>成功率 ${tryN?Math.round(suc/tryN*100):0}%</div><div>最高強化 +${maxEnchant(this)}</div></div><div class="small" style="margin-top:8px">BOSS 會額外機率掉落祝武、祝防、飾品卷。</div></div>${panel}</div><h3 class="title" style="margin-top:18px">可強化裝備</h3>${list}<h3 class="title" style="margin-top:18px">強化紀錄</h3>${logs}`;
   },
   viewShop(){
     let base=(typeof Game.__v4OldViewShop==='function'?Game.__v4OldViewShop.call(this):(this.__proto__.viewShop?this.__proto__.viewShop.call(this):''));
     return base;
   },
   renderTab(){oldRenderTab();let el=document.getElementById('tabContent');if(!this.state||!el)return;if(this.tab==='enchant')el.innerHTML=this.viewEnchant();
     if(this.tab==='enchant'){
       el.querySelectorAll('[data-enchant-target]').forEach(b=>b.onclick=()=>this.chooseEnchantTarget(b.dataset.enchantTarget));
       el.querySelectorAll('[data-enchant-do]').forEach(b=>b.onclick=()=>this.doEnchant(b.dataset.key,b.dataset.enchantDo));
     }
   }
 });
 // 保留 商店，但補強說明與確保祝福卷軸不在一般強化中被自動消耗。
 Game.__v4OldViewShop=Game.viewShop.bind(Game);
 const oldViewShop=Game.viewShop.bind(Game);
 Game.viewShop=function(){let html=oldViewShop();return String(html).replace('<h3 class="title">商店</h3>','<h3 class="title">商店</h3><div class="small">V4：一般商店販售武卷、防卷、飾品卷；祝武/祝防主要由 BOSS、副本、製作或拍賣場取得，強化頁可手動選擇。</div>');};
})();



/* ==============================
   Patch
   重構：武器/防具官方化、商店移除裝備販售、加入經驗藥水
   ============================== */
(()=>{
 const VERSION='5.3';
 const rarityRank={'白':1,'綠':2,'藍':3,'紫':4,'橘':5,'紅':6};
 const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m));
 const put=(id,o)=>{DB.items[id]=Object.assign(DB.items[id]||{id},o,{id});return DB.items[id];};
 const weapon=(id,name,weapon,small,large,rarity='白',reqLv=1,safe=6,stat={},extra={})=>put(id,{name,type:'weapon',weapon,small,large,dmg:Math.max(1,Math.round((small+large)/2)),safe,rarity,reqLv,price:0,stat,officialLike:true,...extra});
 const armor=(id,name,type,ac,rarity='白',reqLv=1,safe=4,stat={},extra={})=>put(id,{name,type,ac,safe,rarity,reqLv,price:0,stat,officialLike:true,...extra});
 const acc=(id,name,type,stat={},rarity='白',reqLv=1,safe=0)=>put(id,{name,type,stat,rarity,reqLv,safe,price:0,officialLike:true});
 const consumable=(id,o)=>put(id,o);

 // 1) 官方風格武器資料：名稱、大小怪攻擊、安定值、職業武器類型。
 weapon('orc_dagger','短劍','dagger',4,2,'白',1,6,{hit:1});
 weapon('silver_dagger','銀短劍','dagger',4,2,'白',8,6,{hit:1},{undead:true});
 weapon('mail_breaker','破甲劍','dagger',4,5,'綠',22,6,{hit:3});
 weapon('long_sword','長劍','sword',8,12,'白',8,6,{hit:1});
 weapon('silver_sword','銀長劍','sword',8,12,'綠',16,6,{hit:1},{undead:true});
 weapon('damascus','大馬士革刀','sword',10,11,'綠',20,6,{hit:2},{unbreakable:true});

 Object.assign(Game,{
   migrateState(){oldMigrate();if(!this.state)return;this.state.version=VERSION;this.state.petSlots=this.state.petSlots||1;this.state.activePets=Array.isArray(this.state.activePets)?this.state.activePets:[];if(this.state.activePet&&!this.state.activePets.includes(this.state.activePet))this.state.activePets.unshift(this.state.activePet);this.state.activePets=this.state.activePets.filter(Boolean).slice(0,this.state.petSlots);this.state.pets=this.state.pets||{};Object.values(DB.items).forEach(d=>{if(isEquip(d))d.reqLv=1;});},
   canEquipKey(k){let it=this.invItem(k),d=it&&DB.items[it.id];return !!d&&EQUIP_TYPES.includes(d.type)&&(d.type!=='weapon'||this.cls().weapons.includes(d.weapon));},
   equip(key){let original=this.invItem(key);if(!original)return;let d=DB.items[original.id];if(d.type==='weapon'&&!this.cls().weapons.includes(d.weapon)){alert(this.cls().name+'不能裝備此武器');return;}key=this.splitOne(key);let slot=d.type;if(d.type==='ring')slot=!this.state.equip.ring1?'ring1':(!this.state.equip.ring2?'ring2':'ring1');if(d.type==='earring')slot=!this.state.equip.earring1?'earring1':(!this.state.equip.earring2?'earring2':'earring1');this.state.equip[slot]=key;if(this.state.inventory[key])this.state.inventory[key].qty=1;this.log('已裝備 '+d.name,'green');this.render();},
   sellPriceForKey(key){let it=this.invItem(key),d=it&&DB.items[it.id];if(!it||!d)return 0;if(isEquip(d))return sellPrice(d,it)*(it.qty||1);return Math.max(1,Math.floor((d.price||100)*0.35))* (it.qty||1);},

   batchSell(kind){let gain=0,sold=0;for(let k of Object.keys(this.state.inventory||{})){let it=this.state.inventory[k],d=DB.items[it.id];if(!d||Object.values(this.state.equip||{}).includes(k))continue;let ok=kind==='white'?isEquip(d)&&d.rarity==='白':kind==='trash'&&d.type==='material';if(!ok)continue;let price=this.sellPriceForKey(k);gain+=price;sold+=it.qty||1;delete this.state.inventory[k];}this.state.adena+=gain;this.log(`批次整理完成：賣出 ${sold} 件，依階級獲得 ${gain.toLocaleString()} 金幣。`,'green');this.render();},
   totalStats(){let s=oldTotalStats();let list=(this.state.activePets||[]).filter(Boolean).slice(0,this.state.petSlots||1);let primary=this.state.activePet||list[0];list.forEach(id=>{if(id===primary)return;let def=petDef(id),own=this.state.pets?.[id];if(def&&own)s=this.addStatsMerge?s=this.addStatsMerge(s,petBonus(def,own.lv||1)):Object.assign(s,petBonus(def,own.lv||1));});return s;},
   fight(){oldFight();let list=(this.state.activePets||[]).filter(Boolean).slice(0,this.state.petSlots||1),primary=this.state.activePet||list[0];for(let id of list){if(id===primary)continue;if(!this.mon()||this.mon().hp<=0)break;let def=petDef(id),own=this.state.pets?.[id];if(!def||!own)continue;let pdmg=Math.max(1,Math.floor((def.stat.dmg||2)*2+(own.lv||1)*1.5));this.mon().hp-=pdmg;this.blog(`${def.name} 協助攻擊，造成 <span class="c-purple">${pdmg}</span> 傷害。`);if(this.mon().hp<=0){let mdef=DB.mons[this.mon().id];this.kill(mdef);break;}}},

 });

// === Hotfix: 背包 / 裝備頁即時刷新強化 ===
(()=>{
  if(!window.Game) return;
  Game.invSignatureV441=function(){
    const inv=this.state&&this.state.inventory||{};
    const eq=this.state&&this.state.equip||{};
    const invPart=Object.keys(inv).sort().map(k=>{
      const it=inv[k]||{};
      return [k,it.id,it.qty||0,it.enchant||0,it.refine?JSON.stringify(it.refine):'',it.enchantAttr?JSON.stringify(it.enchantAttr):''].join(':');
    }).join('|');
    const eqPart=Object.keys(eq).sort().map(k=>k+':' +(eq[k]||'')).join('|');
    return invPart+'#'+eqPart+'#'+(this.state?this.state.adena:0)+'#'+(this.tab||'');
  };
  Game.refreshBackpackV441=function(force=false){
    if(!this.state) return;
    const sig=this.invSignatureV441();
    const changed=force || sig!==this._lastInvSignatureV441;
    this._lastInvSignatureV441=sig;
    this.renderStatus();
    if(changed && ['inventory','equipment','shop','collection'].includes(this.tab)){
      this.renderTab();
    }
  };
  Game.queueBackpackV441=function(force=false){
    if(!this.state) return;
    clearTimeout(this._backpackRefreshTimerV441);
    this._backpackRefreshTimerV441=setTimeout(()=>this.refreshBackpackV441(force),0);
  };
  const wrap=(name,force=true)=>{
    const old=Game[name];
    if(typeof old!=='function' || old._v441Wrapped) return;
    const fn=function(...args){
      const r=old.apply(this,args);
      this.queueBackpackV441(force);
      return r;
    };
    fn._v441Wrapped=true;
    Game[name]=fn;
  };
  ['addItem','removeItem','splitOne','useItem','sellItem','buy','equip','unequip','enchant','autoPotion','autoBuyConsumable','sellWhite','kill','levelUp','learnByLevel'].forEach(n=>wrap(n,true));
  const oldTick=Game.tick;
  if(typeof oldTick==='function' && !oldTick._v441Wrapped){
    const fn=function(...args){
      const before=this.invSignatureV441?this.invSignatureV441():'';
      const r=oldTick.apply(this,args);
      const after=this.invSignatureV441?this.invSignatureV441():'';
      if(before!==after || ['inventory','equipment','shop'].includes(this.tab)) this.refreshBackpackV441(before!==after);
      return r;
    };
    fn._v441Wrapped=true;
    Game.tick=fn;
  }
  const oldRenderTab=Game.renderTab;
  if(typeof oldRenderTab==='function' && !oldRenderTab._v441Rebind){
    const fn=function(...args){
      const r=oldRenderTab.apply(this,args);
      const el=document.getElementById('tabContent');
      if(el){
        el.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>this.equip(b.dataset.equip));
        el.querySelectorAll('[data-enchant]').forEach(b=>b.onclick=()=>this.enchant(b.dataset.enchant));
        el.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>this.useItem(b.dataset.use));
        el.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>this.sellItem(b.dataset.sell));
        el.querySelectorAll('[data-unequip]').forEach(b=>b.onclick=()=>this.unequip(b.dataset.unequip));
        el.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>this.buy(b.dataset.buy));
      }
      if(this.state) this._lastInvSignatureV441=this.invSignatureV441();
      return r;
    };
    fn._v441Rebind=true;
    Game.renderTab=fn;
  }
  const oldEnter=Game.enter;
  if(typeof oldEnter==='function' && !oldEnter._v441Wrapped){
    const fn=function(...args){
      const r=oldEnter.apply(this,args);
      this.refreshBackpackV441(true);
      return r;
    };
    fn._v441Wrapped=true;
    Game.enter=fn;
  }
})();

/* === lineage_Idle_V1.3 Patch: inventory equipment display and remove backpack enchant === */
(()=>{
  const VERSION='5.3';
  const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]||m));
  const oldMigrateV48=Game.migrateState.bind(Game);
  const oldViewInventoryV48=Game.viewInventory.bind(Game);

  Game.migrateState=function(){
    oldMigrateV48();
    if(this.state)this.state.version=VERSION;
  };

  Game.viewInventory=function(){
    let html=oldViewInventoryV48();

    // V5.3：背包內移除所有「強化」按鈕，強化僅保留在裝備頁對已穿戴裝備操作。
    html=html.replace(/<button class="btn(?: [^"]*)?" data-enchant="[^"]*">強化<\/button>/g,'');

    // V5.3：已裝備的背包物品不再顯示「裝備」按鈕，改顯示「裝備中」。
    const equippedKeys=Object.values(this.state?.equip||{}).filter(Boolean);
    for(const key of equippedKeys){
      const ek=esc(key).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const equipBtn=new RegExp(`<button class="btn(?: green)?" data-equip="${ek}">裝備<\\/button>`,'g');
      html=html.replace(equipBtn,'<span class="pill c-green">裝備中</span>');
    }

    html=html.replace('可直接使用藥水、技能書；裝備可裝備、強化或賣出。','可直接使用藥水、技能書；裝備可裝備或賣出。已裝備物品會顯示「裝備中」。');
    return html;
  };

  document.title='lineage_Idle_V1.3';
  document.querySelectorAll('.title').forEach(el=>{if(el.textContent.includes('lineage_Idle'))el.textContent='lineage_Idle_V1.3';});
  const st=document.querySelector('#start h1');if(st)st.textContent='lineage_Idle_V1.3';
  const top=document.querySelector('.top .title');if(top)top.textContent='lineage_Idle_V1.3';
})();

  };

  Game.viewSettings=function(){
    let html=oldViewSettingsV48Rebirth();
    if(!hasRebirth(this))return html;
    let s=this.state.settings||{};
    let options=Object.values(DB.transforms).map(t=>`<option value="${esc(t.id)}" ${s.autoTransform===t.id?'selected':''}>${esc(t.name)}（1轉解鎖）</option>`).join('');

    return html;
  };
})();



/* === lineage_Idle_V1.3 Core Consolidation ===
   目標：
   1. 版本統一 V1.0
   2. 背包、裝備、售出判定集中於單一核心
   3. 移除篩選型出售邏輯；出售規則固定為「未裝備全部賣掉」
*/
(()=>{
  if(!window.Game || !window.DB) return;

  const VERSION='1.0';
  const SAVE_KEY='lineage_idle_v10';

  const money=n=>Math.max(0,Math.floor(Number(n)||0)).toLocaleString();
  const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  // 存檔版本統一
  if(window.Store){
    Store.key=SAVE_KEY;
  }

  const CORE={
    version:VERSION,

    getEquippedKeys(){
      const eq=this.state?.equip||{};
      return new Set(Object.values(eq).filter(Boolean));
    },

    isEquippedKey(key){
      return this.getEquippedKeys().has(key);
    },

    getInventoryRows(){
      const inv=this.state?.inventory||{};
      return Object.entries(inv)
        .filter(([,it])=>it && DB.items[it.id])
        .sort((a,b)=>{
          const da=DB.items[a[1].id], db=DB.items[b[1].id];
          const ta=this.typeName ? this.typeName(da.type) : da.type;
          const tb=this.typeName ? this.typeName(db.type) : db.type;
          return String(ta).localeCompare(String(tb),'zh-Hant') || String(da.name).localeCompare(String(db.name),'zh-Hant');
        });
    },

    isEquipmentType(type){
      return ['weapon','helmet','tshirt','armor','cloak','gloves','boots','leggings','ring','earring','amulet','belt'].includes(type);
    },

    getSellPriceByKey(key){
      const it=this.state?.inventory?.[key];
      if(!it) return 0;
      const d=DB.items[it.id];
      if(!d) return 0;
      const qty=Math.max(1,Number(it.qty)||1);
      const enchant=Math.max(0,Number(it.enchant)||0);
      return Math.max(1,Math.floor((d.price||100)*(0.35+enchant*0.2)))*qty;
    },

    sellInventoryKey(key,{silent=false}={}){
      const inv=this.state?.inventory||{};
      const it=inv[key];
      if(!it || this.isEquippedKey(key)) return 0;
      const d=DB.items[it.id];
      if(!d) return 0;
      const price=this.getSellPriceByKey(key);
      this.state.adena=(Number(this.state.adena)||0)+price;
      delete inv[key];
      if(!silent && this.log){
        this.log(`賣出 ${d.name}${it.qty>1?' ×'+it.qty:''}，獲得 ${money(price)} 金幣。`,'green');
      }
      return price;
    },

    sellAllUnequipped({silent=false}={}){
      const keys=Object.keys(this.state?.inventory||{});
      let count=0,total=0;
      for(const key of keys){
        if(this.isEquippedKey(key)) continue;
        const it=this.state.inventory[key];
        if(!it || !DB.items[it.id]) continue;
        count+=Math.max(1,Number(it.qty)||1);
        total+=this.sellInventoryKey(key,{silent:true});
      }
      if(total>0 && !silent && this.log){
        this.log(`背包清理完成：已賣出未裝備物品 ${count} 件，獲得 ${money(total)} 金幣。`,'green');
      }else if(total<=0 && !silent && this.log){
        this.log('背包清理完成：沒有可售出的未裝備物品。');
      }
      if(this.render) this.render();
      return {count,total};
    }
  };

  Object.assign(Game,CORE);

  const oldBaseState=Game.baseState?.bind(Game);
  if(oldBaseState){
    Game.baseState=function(cls){
      const s=oldBaseState(cls);
      s.version=VERSION;
      s.settings=s.settings||{};
      // V1.0 出售邏輯固定：未裝備全部出售；不再提供稀有度/類型篩選。
      if(s.settings.autoSell===undefined) s.settings.autoSell=true;
      delete s.settings.sellRarity;
      delete s.settings.sellType;
      delete s.settings.sellFilter;
      delete s.settings.inventoryFilter;
      return s;
    };
  }

  const oldMigrate=Game.migrateState?.bind(Game);
  Game.migrateState=function(){
    if(oldMigrate) oldMigrate();
    const s=this.state;
    if(!s) return;
    s.version=VERSION;
    s.settings=s.settings||{};
    if(s.settings.autoSell===undefined) s.settings.autoSell=true;
    delete s.settings.sellRarity;
    delete s.settings.sellType;
    delete s.settings.sellFilter;
    delete s.settings.inventoryFilter;
  };

  Game.sellItem=function(key){
    this.sellInventoryKey(key,{silent:false});
    this.render();
  };

  // 舊名稱保留給原 kill()/自動流程呼叫，但核心規則已改為：未裝備全部賣出。
  Game.sellWhite=function(){
    return this.sellAllUnequipped({silent:false});
  };

  Game.viewInventory=function(){
    const rows=this.getInventoryRows().map(([k,it])=>{
      const d=DB.items[it.id];
      const equipped=this.isEquippedKey(k);
      const canEquip=this.isEquipmentType(d.type);
      const buttons=[];
      if(canEquip){
        buttons.push(`<button class="btn" data-equip="${escapeHtml(k)}">裝備</button>`);
        buttons.push(`<button class="btn" data-enchant="${escapeHtml(k)}">強化</button>`);
      }
      if(d.type==='potion'||d.type==='book'){
        buttons.push(`<button class="btn green" data-use="${escapeHtml(k)}">使用</button>`);
      }
      if(!equipped){
        buttons.push(`<button class="btn red" data-sell="${escapeHtml(k)}">賣出</button>`);
      }
      return `<div class="item row">
        <span class="rarity-${escapeHtml(d.rarity)}">${this.itemName(k)} <span class="small">${this.typeName(d.type)}${equipped?'｜已裝備':''}</span></span>
        <span>${buttons.join(' ')}</span>
      </div>`;
    }).join('');

    return `<h3 class="title">背包</h3>
      <div class="row" style="margin-bottom:10px">
        <div class="small">V1.0 規則：不再使用篩選；出售判定固定為「未裝備全部賣掉」，已裝備物品永不出售。</div>
        <button class="btn red" data-sell-all="1">清理未裝備</button>
      </div>
      ${rows||'<div class="small">空</div>'}`;
  };

  Game.viewSettings=function(){
    const s=this.state.settings;
    if(!Array.isArray(s.autoSkills)) s.autoSkills=s.autoSkill&&s.autoSkill!=='none'?[s.autoSkill]:[];
    const skills=Object.keys(this.state.skills||{}).map(id=>[id,DB.skills[id].name,DB.skills[id].type,DB.skills[id].mp]);
    const transforms=Object.values(DB.transforms).filter(t=>t.id==='none'||this.state.lv>=t.lv);
    const potionIds=['potion_red','potion_orange','potion_clear'];
    return `<h3 class="title">自動設定</h3>
      <div class="small">V1.0 已移除背包篩選功能。自動出售啟用時，每次擊殺後會直接清理所有未裝備物品；裝備中物品會保留。</div>
      <div class="setting-grid">
        <div class="setting-card">
          <b class="c-gold">戰鬥</b>
          <label class="row item"><span>自動喝水 HP%</span><input data-setting="hpLimit" type="number" min="1" max="99" value="${s.hpLimit}" style="width:90px"></label>
          <label class="row item"><span>自動挑戰 BOSS</span><input data-setting="autoBoss" type="checkbox" ${s.autoBoss?'checked':''}></label>
          <div class="item"><b>自動施放技能（可多選）</b><br>
            ${skills.length?skills.map(x=>`<label class="pill"><input type="checkbox" data-skill-toggle="${x[0]}" ${s.autoSkills.includes(x[0])?'checked':''}> ${x[1]} <span class="small">MP${x[3]} / ${x[2]}</span></label>`).join(' '):'<span class="small">尚未學會可用技能</span>'}
          </div>
        </div>
        <div class="setting-card">
          <b class="c-gold">背包 / 自動補給</b>
          <label class="row item"><span>自動出售未裝備物品</span><input data-setting="autoSell" type="checkbox" ${s.autoSell?'checked':''}></label>
          <button class="btn red" data-sell-all="1" style="width:100%;margin:8px 0">立即清理未裝備</button>
          <label class="row item"><span>藥水不足自動購買</span><input data-setting="autoBuyPotion" type="checkbox" ${s.autoBuyPotion?'checked':''}></label>
          <label class="row item"><span>購買藥水</span><select data-setting="autoBuyPotionId">${potionIds.map(id=>`<option value="${id}" ${s.autoBuyPotionId===id?'selected':''}>${DB.items[id].name}</option>`).join('')}</select></label>
          <label class="row item"><span>補到數量</span><input data-setting="autoBuyPotionQty" type="number" min="1" max="999" value="${s.autoBuyPotionQty||50}" style="width:90px"></label>
          <div class="small">注意：未裝備全部出售規則會賣出背包內未裝備的藥水、卷軸、法書與材料。需要保留時請關閉自動出售。</div>
        </div>
        <div class="setting-card">
          <b class="c-gold">變身</b>
          <label class="row item"><span>預設變身</span><select data-setting="autoTransform">${transforms.map(t=>`<option value="${t.id}" ${s.autoTransform===t.id?'selected':''}>${t.name}</option>`).join('')}</select></label>
          <div class="small">選擇後會立即變身；之後變身結束會自動補上。</div>
        </div>
      </div>`;
  };

  const oldRenderTab=Game.renderTab?.bind(Game);
  Game.renderTab=function(){
    if(oldRenderTab) oldRenderTab();
    const el=document.getElementById('tabContent');
    if(!el) return;
    el.querySelectorAll('[data-sell-all]').forEach(btn=>{
      btn.onclick=()=>this.sellAllUnequipped({silent:false});
    });
  };

  const oldStartNew=Game.startNew?.bind(Game);
  if(oldStartNew){
    Game.startNew=function(){
      oldStartNew();
      if(this.state){
        this.state.version=VERSION;
        this.save(false);
      }
    };
  }

  const oldImportSave=Game.importSave?.bind(Game);
  if(oldImportSave){
    Game.importSave=function(e){
      oldImportSave(e);
    };
  }

  // 畫面版本字樣統一
  document.addEventListener('DOMContentLoaded',()=>{
    document.title='lineage_Idle_V1.3';
    document.querySelectorAll('.title').forEach(el=>{
      if(el.textContent && el.textContent.includes('lineage_Idle_')) el.textContent=el.textContent.replace(/lineage_Idle_V[\d.]+/g,'lineage_Idle_V1.3');
    });
  });
})();

    {id:'guild_request',name:'血盟委託',type:'guild',weight:7,desc:g=>'附近據點向你的血盟求援，你完成巡邏並取得血盟聲望。',apply:g=>{if(g.state.guild?.name){let gain=g.state.lv*420;g.state.guild.exp=(g.state.guild.exp||0)+gain;g.state.guild.contribution=(g.state.guild.contribution||0)+gain;g.normalizeGuild&&g.normalizeGuild();return `血盟經驗 +${gain.toLocaleString()}`;}let gain=g.state.lv*90;g.state.adena+=gain;return `尚未加入血盟，改獲金幣 +${gain.toLocaleString()}`;}},
    {id:'dragon_trace',name:'四龍殘痕',type:'boss',weight:5,desc:g=>'地面留下龍族爪痕，空氣中有古代魔力，你取得稀有材料。',apply:g=>{let item=Math.random()<0.5?'scroll_bless_armor':'scroll_bless_weapon';g.addItem(item,1,0);return `${DB.items[item]?.name||item} ×1`;},minLv:55},
    {id:'ambush',name:'魔物伏擊',type:'risk',weight:8,desc:g=>'一群魔物從陰影中伏擊你。你擊退牠們，但消耗了一些生命。',apply:g=>{let loss=Math.floor(g.maxHp()*0.18);g.state.hp=Math.max(1,g.state.hp-loss);let exp=Math.floor(g.needExp()*0.035);g.state.exp+=exp;return `HP -${loss}，EXP +${exp}`;}},
    {id:'treasure_map',name:'破損藏寶圖',type:'treasure',weight:6,desc:g=>'你在怪物屍體旁發現破損藏寶圖，找到了被掩埋的金幣袋。',apply:g=>{let gain=g.state.lv*300+3000;g.state.adena+=gain;g.updateQuest&&g.updateQuest('adena',gain);return `金幣 +${gain.toLocaleString()}`;}},
    {id:'healer',name:'亞丁祭司',type:'heal',weight:8,desc:g=>'亞丁祭司正在救助傷兵，也為你施放治癒與守護祝福。',apply:g=>{g.state.hp=g.maxHp();g.state.mp=Math.min(g.maxMp(),g.state.mp+Math.floor(g.maxMp()*0.35));g.state.buffs.v11_priest={name:'祭司守護',dr:4,mr:12,until:Date.now()+240000};return 'HP 回滿，MP 回復，獲得祭司守護';}}
  ];

  const oldMigrate=Game.migrateState.bind(Game);
  const oldInitMenus=Game.initMenus.bind(Game);
  const oldRenderTab=Game.renderTab.bind(Game);
  const oldTotalStats=Game.totalStats.bind(Game);
  const oldKill=Game.kill.bind(Game);
  const oldAddItem=Game.addItem.bind(Game);
  const oldUseAutoSkill=Game.useAutoSkill.bind(Game);
  const oldViewStory=Game.viewStory.bind(Game);
  const oldDoEnchant=Game.doEnchant?Game.doEnchant.bind(Game):null;
  const oldApplyOffline=Game.applyOffline.bind(Game);

  Object.assign(Game,{
    migrateState(){
      oldMigrate();
      if(!this.state) return;
      this.state.version=VERSION;
      this.state.v11=this.state.v11||{encounters:[],mapKills:{},adenaToday:0};
      this.state.guild=this.state.guild||{name:null,level:0,exp:0,contribution:0};
      this.normalizeGuild();
      this.resetDailyIfNeeded();
      setVersionText();
    },
    initMenus(){
      oldInitMenus();
      setVersionText();
      const tabs=document.getElementById('tabs');
      if(tabs){
        const order=['equipment','inventory','settings','guild','quest','setbonus','story','pet','dungeon','enchant','refine','auction','party','achievement','craft','warehouse','stats','transform','skills','maps','collection','shop'];
        const labels={equipment:'裝備',inventory:'背包',settings:'自動設定',guild:'血盟/公會',quest:'任務',setbonus:'套裝',story:'劇情/奇遇',pet:'寵物/召喚',dungeon:'副本/活動',enchant:'強化',refine:'洗鍊/附魔',auction:'拍賣場',party:'隊伍/組隊',achievement:'成就',craft:'製作',warehouse:'倉庫',stats:'統計',transform:'變身',skills:'職業技能',maps:'地圖掉落',collection:'收藏',shop:'商店'};
        const existing=new Set(Array.from(tabs.querySelectorAll('.tab')).map(b=>b.dataset.tab));
        order.forEach(x=>existing.add(x));
        tabs.innerHTML=order.filter(x=>existing.has(x)).map(x=>`<button class="btn tab" data-tab="${x}">${labels[x]||x}</button>`).join('');
        tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{this.tab=b.dataset.tab;this.renderTab();});
      }
    },
    normalizeGuild(){
      const g=this.state.guild;if(!g) return;
      if(!g.name){g.level=0;g.exp=g.exp||0;g.contribution=g.contribution||0;return;}
      g.level=Math.max(1,Math.min(20,g.level||1));
      while(g.level<20 && (g.exp||0)>=V11.guildNeed(g.level)) g.level++;
      if(g.level>20) g.level=20;
    },
    resetDailyIfNeeded(){
      const d=V11.today();
      if(!this.state.daily||this.state.daily.date!==d||this.state.daily.v!=='1.1'){
        const q={};
        V11.questDefs().forEach(x=>q[x.id]={progress:0,claimed:false});
        this.state.daily={date:d,v:'1.1',quests:q,map:this.state.map};
        this.state.v11=this.state.v11||{};this.state.v11.mapKills={};this.state.v11.adenaToday=0;
      }
    },
    updateQuest(type,amount=1){
      this.resetDailyIfNeeded();
      for(const q of V11.questDefs().filter(x=>x.type===type)){
        const st=this.state.daily.quests[q.id];
        if(st&&!st.claimed) st.progress=Math.min(q.need,(st.progress||0)+amount);
      }
    },
    giveReward(r){
      if(!r) return;
      let adena=r.adena||0;
      if(adena && this.state.guild?.level>=5) adena=Math.floor(adena*1.1);
      if(adena){this.state.adena+=adena;this.state.v3Stats=this.state.v3Stats||{};this.state.v3Stats.adenaEarned=(this.state.v3Stats.adenaEarned||0)+adena;}
      if(r.exp) this.state.exp+=r.exp;
      if(r.expRate) this.state.exp+=Math.floor(this.needExp()*r.expRate);
      if(r.item) this.addItem(r.item,r.qty||1,0);
      this.levelUp();
    },
    claimQuest(id){
      this.resetDailyIfNeeded();
      const def=V11.questDefs().find(x=>x.id===id), st=this.state.daily.quests[id];
      if(!def||!st||st.claimed||st.progress<def.need) return;
      st.claimed=true;this.giveReward(def.reward);this.log('領取 V1.1 任務獎勵：'+def.name,'green');this.save(false);this.render();
    },
    addItem(id,qty=1,enchant=0){
      oldAddItem(id,qty,enchant);
      if(this.state?.daily?.v==='1.1'){
        let add=qty;
        if(this.state.guild?.level>=12 && DB.items[id]?.type!=='potion') add+=1;
        this.updateQuest('loot',add);
      }
    },
    useAutoSkill(){
      oldUseAutoSkill();
      if(this._skillCast) this.updateQuest('skill',1);
    },
    kill(mdef){
      const before=this.state.adena||0;
      oldKill(mdef);
      this.state.v11=this.state.v11||{encounters:[],mapKills:{},adenaToday:0};
      this.updateQuest('kill',1);
      this.updateQuest('mapKill',1);
      if(mdef?.boss) this.updateQuest('boss',1);
      const gained=Math.max(0,(this.state.adena||0)-before);
      if(gained){this.state.v11.adenaToday=(this.state.v11.adenaToday||0)+gained;this.updateQuest('adena',gained);}
      this.normalizeGuild();
    },
    applyOffline(){
      const before=this.state?.adena||0;
      oldApplyOffline();
      const gained=Math.max(0,(this.state?.adena||0)-before);
      if(gained && this.state?.guild?.level>=15){
        const bonus=Math.floor(gained*0.15);
        this.state.adena+=bonus;
        this.log(`血盟遠征軍離線加成：金幣 +${bonus.toLocaleString()}`,'green');
      }
    },
    doEnchant(key,mode){
      if(oldDoEnchant) oldDoEnchant(key,mode);
      this.updateQuest('enchant',1);
    },
    createGuild(){
      const name=prompt('請輸入血盟 / 公會名稱','亞丁遠征軍');
      if(!name) return;
      if(this.state.adena<100000){alert('創建需要 100,000 金幣');return;}
      this.state.adena-=100000;
      this.state.guild={name,level:1,exp:0,contribution:0};
      this.log('創建血盟：'+name,'green');this.render();
    },
    donateGuild(){
      if(!this.state.guild?.name) return;
      let amt=Number(prompt('捐獻金幣數量','50000')||0);
      if(!amt||amt<=0) return;
      if(this.state.adena<amt){alert('金幣不足');return;}
      this.state.adena-=amt;this.state.guild.exp=(this.state.guild.exp||0)+amt;this.state.guild.contribution=(this.state.guild.contribution||0)+amt;
      const oldLv=this.state.guild.level||1;this.normalizeGuild();
      this.log(`血盟捐獻 ${amt.toLocaleString()}，目前 Lv.${this.state.guild.level}`,'green');
      if(this.state.guild.level>oldLv) this.log(`<span class="c-gold">血盟升級！Lv.${this.state.guild.level}</span>`,'green');
      this.save(false);this.render();
    },
    totalStats(){
      let s=oldTotalStats();
      const glv=this.state?.guild?.name?(this.state.guild.level||0):0;
      if(glv){s=V11.sub(s,V11.oldGuildBonus(glv));s=V11.add(s,V11.guildBonus(glv));}
      const equipped=Object.values(this.state?.equip||{}).map(k=>this.invItem(k)).filter(Boolean).map(x=>x.id);
      for(const [id,old] of Object.entries(V11.oldSetBonuses)){
        const oldItems={iron:['iron_helm','iron_armor','iron_gloves','iron_boots','iron_leggings'],dragon:['dragon_armor','dragon_ring','myth_earring'],mage:['staff_mana','ice_staff','wisdom_ring','mana_earring'],assassin:['dual_blade','dark_claw','dark_earring']}[id]||[];
        if(oldItems.length && oldItems.every(x=>equipped.includes(x))) s=V11.sub(s,old);
      }
      for(const set of this.activeSetBonusesV11()) s=V11.add(s,set.bonus);
      return s;
    },
    activeSetBonusesV11(){
      const equipped=Object.values(this.state?.equip||{}).map(k=>this.invItem(k)).filter(Boolean).map(x=>x.id);
      const out=[];
      for(const [id,set] of Object.entries(V11.sets)){
        const count=set.items.filter(x=>equipped.includes(x)).length;
        let best=null;
        for(const step of set.steps) if(count>=step.need) best=step;
        if(best) out.push({id,name:set.name,count,total:set.items.length,bonus:best.bonus,desc:best.desc,steps:set.steps,items:set.items});
      }
      return out;
    },
    activeSetBonuses(){return this.activeSetBonusesV11();},
    storyEncounter(mdef){
      const baseChance=0.16+(this.state.guild?.level>=10?0.02:0);
      if(Math.random()>baseChance) return;
      const pool=[];
      V11.encounters.forEach(e=>{
        if(e.minLv && this.state.lv<e.minLv) return;
        let w=e.weight||1;
        if(e.type==='risk' && this.state.guild?.level>=10) w=Math.max(1,Math.floor(w*0.55));
        for(let i=0;i<w;i++) pool.push(e);
      });
      const e=V11.pick(pool)||V11.encounters[0];
      const result=e.apply(this,mdef);
      this.levelUp();
      this.state.v11=this.state.v11||{};this.state.v11.encounters=this.state.v11.encounters||[];
      this.state.v11.encounters.unshift({time:Date.now(),name:e.name,type:e.type,map:this.map().name,result});
      this.state.v11.encounters=this.state.v11.encounters.slice(0,30);
      this.updateQuest('encounter',1);
      this.log(`<span class="c-purple">奇遇：${e.name}</span> ${e.desc(this)} <span class="c-gold">${result}</span>`,'green');
    },
    viewGuild(){
      const g=this.state.guild;
      if(!g?.name) return `<h3 class="title">血盟 / 公會 V1.1</h3><div class="small">創建後可捐獻金幣提升血盟等級。V1.1 最高 20 等，會提供傷害、命中、減傷、HP、MP、MR、速度與特殊門檻加成。</div><button class="btn green" data-create-guild="1">創建血盟 / 公會（100,000 金幣）</button>`;
      this.normalizeGuild();
      const lv=g.level||1, need=lv>=20?0:V11.guildNeed(lv), pct=lv>=20?100:Math.min(100,(g.exp||0)/need*100), bonus=V11.guildBonus(lv);
      const perks=V11.guildBuffs.map(([n,t])=>`<span class="pill ${lv>=n?'c-gold':''}">Lv.${n} ${t}${lv>=n?' ✓':''}</span>`).join(' ');
      return `<h3 class="title">血盟 / 公會 V1.1</h3><div class="setting-card"><div class="row"><b class="c-gold">${g.name}</b><span>Lv.${lv}/20</span></div><div class="bar" style="margin:8px 0"><i class="exp" style="width:${pct}%"></i><span>${lv>=20?'MAX':`${(g.exp||0).toLocaleString()} / ${need.toLocaleString()}`}</span></div><div class="small">貢獻 ${Number(g.contribution||0).toLocaleString()}｜加成：${V11.statText(bonus)}</div><button class="btn green" data-donate-guild="1" ${lv>=20?'disabled':''}>捐獻金幣</button></div><h3 class="title" style="margin-top:14px">等級門檻</h3><div>${perks}</div>`;
    },
    viewQuest(){
      this.resetDailyIfNeeded();
      const rows=V11.questDefs().map(q=>{
        const st=this.state.daily.quests[q.id]||{progress:0,claimed:false};
        const done=(st.progress||0)>=q.need;
        const rw=[q.reward.adena?`金幣 ${q.reward.adena.toLocaleString()}`:'',q.reward.expRate?`EXP ${Math.round(q.reward.expRate*100)}%`:'',q.reward.item?`${DB.items[q.reward.item]?.name||q.reward.item} ×${q.reward.qty||1}`:''].filter(Boolean).join('、');
        return `<div class="item row"><span><b class="${done?'c-gold':''}">${q.name}</b><br><span class="small">${q.desc}｜進度 ${Math.min(st.progress||0,q.need)}/${q.need}｜獎勵：${rw}</span></span><span>${st.claimed?'<span class="c-green">已領取</span>':`<button class="btn green" data-claim-quest="${q.id}" ${done?'':'disabled'}>領取</button>`}</span></div>`;
      }).join('');
      return `<h3 class="title">任務 V1.1</h3><div class="small">每日任務改為多目標：討伐、地區壓制、BOSS、掉落、技能、奇遇、金幣與強化。血盟 Lv.5 後任務金幣獎勵 +10%。</div>${rows}`;
    },
    viewSetBonus(){
      const equipped=Object.values(this.state.equip||{}).map(k=>this.invItem(k)).filter(Boolean).map(x=>x.id);
      const rows=Object.entries(V11.sets).map(([id,set])=>{
        const count=set.items.filter(x=>equipped.includes(x)).length;
        let best=null;for(const step of set.steps) if(count>=step.need) best=step;
        const itemNames=set.items.map(i=>`${equipped.includes(i)?'✓':'□'} ${DB.items[i]?.name||i}`).join('、');
        return `<div class="setting-card"><div class="row"><b class="${best?'c-gold':''}">${set.name}</b><span class="pill">${count}/${set.items.length}</span></div><div class="small">部件：${itemNames}</div>${set.steps.map(s=>`<div class="item"><span class="${count>=s.need?'c-green':'small'}">${s.desc}｜${V11.statText(s.bonus)}</span></div>`).join('')}</div>`;
      }).join('');
      return `<h3 class="title">套裝 V1.1</h3><div class="small">套裝改為 2 / 3 / 完整套分段啟用，不必集滿才有效。效果會自動計入角色能力。</div><div class="setting-grid">${rows}</div>`;
    },
    viewStory(){
      const chapters=[['亞丁曙光','說話之島的異變擴散，古魯丁、奇岩與龍之谷開始出現同源魔力。'],['血盟遠征','各地據點開始發布血盟委託，玩家可透過奇遇與任務累積聲望。'],['傲慢裂縫','傲慢之塔的怪物會引出更高階奇遇，包含古代石碑、龍族殘痕與首領追蹤。'],['四龍前線','四龍眷族正在收集古代裝備，終局套裝與血盟等級將成為遠征關鍵。']];
      const hist=(this.state.v11?.encounters||[]).slice(0,15).map(e=>`<div class="item"><b class="c-purple">${e.name}</b> <span class="pill">${e.type}</span><br><span class="small">${new Date(e.time).toLocaleString()}｜${e.map}｜${e.result}</span></div>`).join('')||'<div class="small">尚未觸發 V1.1 奇遇。狩獵時會自動觸發。</div>';
      return `<h3 class="title">劇情 / 奇遇 V1.1</h3>${chapters.map(c=>`<div class="item"><b class="c-gold">${c[0]}</b><br><span class="small">${c[1]}</span></div>`).join('')}<h3 class="title" style="margin-top:14px">奇遇紀錄</h3><div class="small">奇遇現在分為劇情、交易、增益、支援、工匠、血盟、龍族、風險、寶藏與治療類，並會連動每日任務。</div>${hist}`;
    },
    renderTab(){
      oldRenderTab();
      const el=document.getElementById('tabContent'); if(!this.state||!el) return;
      if(this.tab==='guild') el.innerHTML=this.viewGuild();
      if(this.tab==='quest') el.innerHTML=this.viewQuest();
      if(this.tab==='setbonus') el.innerHTML=this.viewSetBonus();
      if(this.tab==='story') el.innerHTML=this.viewStory();
      el.querySelectorAll('[data-create-guild]').forEach(b=>b.onclick=()=>this.createGuild());
      el.querySelectorAll('[data-donate-guild]').forEach(b=>b.onclick=()=>this.donateGuild());
      el.querySelectorAll('[data-claim-quest]').forEach(b=>b.onclick=()=>this.claimQuest(b.dataset.claimQuest));
    }
  });
})();



/* ==============================
   Lineage Idle V1.2 Upgrade Patch
   - 已裝備 / 未裝備背包分頁
   - 自動整理背包
   - 套裝專屬圖示
   - 工會 20 級完整技能樹
   - 奇遇事件池 50+ 事件
   ============================== */
(()=>{
  const VERSION='1.2';
  const TITLE='lineage_Idle_V1.3';
  const EQUIP_TYPES=['weapon','helmet','tshirt','armor','cloak','gloves','boots','leggings','ring','earring','amulet','belt'];
  const rarityRank={'白':1,'綠':2,'藍':3,'紫':4,'橘':5,'紅':6};
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const setTitle=()=>{
    document.title=TITLE;
    document.querySelectorAll('.title').forEach(el=>{ if(String(el.textContent||'').includes('lineage_Idle')) el.textContent=TITLE; });
    const h1=document.querySelector('#start h1'); if(h1) h1.textContent=TITLE;
    const top=document.querySelector('.top .title'); if(top) top.textContent=TITLE;
  };
  setTitle();

  const V12={};
  V12.add=(a,b)=>{let r={...a};for(const k in b)if(typeof b[k]==='number')r[k]=(r[k]||0)+b[k];return r;};
  V12.statText=o=>Object.entries(o||{}).map(([k,v])=>`${String(k).toUpperCase()} ${v>0?'+':''}${v}`).join('、')||'無';
  V12.itemName=id=>DB.items[id]?.name||id;
  V12.guildNeed=lv=> lv>=20?Infinity:Math.floor(6000*Math.pow(lv,1.72)+lv*lv*3500);
  V12.guildBonus=lv=>{
    lv=Math.max(0,Math.min(20,lv||0));
    return {
      dmg:Math.floor(lv*2.2), hit:Math.floor(lv*1.1), dr:Math.floor(lv*.75),
      hp:lv*70, mp:lv*34, mr:Math.floor(lv*2.4), spd:Math.floor(lv/4),
      str:lv>=8?1:0, dex:lv>=10?1:0, int:lv>=12?1:0, wis:lv>=14?1:0, con:lv>=16?1:0
    };
  };
  V12.guildSkills=[
    {lv:1,id:'camp',name:'血盟營地',desc:'開啟血盟基礎加成。',bonus:{hp:70,mp:34}},
    {lv:2,id:'training',name:'共同訓練',desc:'命中與傷害提升。',bonus:{dmg:2,hit:1}},
    {lv:3,id:'supply',name:'補給網',desc:'任務金幣獎勵提高。',effect:'任務金幣 +5%'},
    {lv:4,id:'guard',name:'守備隊',desc:'減傷與魔防提升。',bonus:{dr:3,mr:8}},

      });

      let result='';
      if(e.effect==='item'){this.addItem(e.item,e.qty||1,0);result=`獲得 ${V12.itemName(e.item)} ×${e.qty||1}`;}
      else if(e.effect==='heal'){let hp=Math.floor(this.maxHp()*0.35),mp=Math.floor(this.maxMp()*0.25);this.state.hp=Math.min(this.maxHp(),this.state.hp+hp);this.state.mp=Math.min(this.maxMp(),this.state.mp+mp);result=`恢復 HP ${hp} / MP ${mp}`;}
      else if(e.effect==='adena'){let gain=Math.floor((this.state.lv*120+800)*(1+(glv>=19?0.15:0)));this.state.adena+=gain;this.updateQuest('adena',gain);result=`金幣 +${gain.toLocaleString()}`;}
      else if(e.effect==='exp'){let gain=Math.floor(this.needExp()*0.045);this.state.exp+=gain;this.levelUp();result=`EXP +${gain.toLocaleString()}`;}
      else if(e.effect==='guild'){if(this.state.guild?.name){let gx=this.state.lv*180+1200;this.state.guild.exp=(this.state.guild.exp||0)+gx;while(this.state.guild.level<20&&this.state.guild.exp>=V12.guildNeed(this.state.guild.level))this.state.guild.level++;this.updateQuest('guild',1);result=`血盟經驗 +${gx.toLocaleString()}`;}else{let gain=this.state.lv*80;this.state.adena+=gain;result=`未加入血盟，改得金幣 +${gain.toLocaleString()}`;}}
      else if(e.effect==='quest'){this.updateQuest('mapkill',3);this.updateQuest('encounter',1);result='任務進度追加';}
      else if(e.effect==='treasure'){let item=['potion_orange','potion_clear','scroll_armor','scroll_weapon','scroll_accessory'][Math.floor(Math.random()*5)];let qty=item.includes('potion')?3:1;this.addItem(item,qty,0);result=`寶藏：${V12.itemName(item)} ×${qty}`;}
      else if(e.effect==='risk'){let gain=this.state.lv*150+1000;this.state.adena+=gain;this.state.hp=Math.max(1,this.state.hp-Math.floor(this.maxHp()*0.08));this.updateQuest('adena',gain);result=`承受風險，金幣 +${gain.toLocaleString()}`;}
      else {let buffs=[{dmg:5,hit:3},{dr:4,mr:10},{spd:6,hit:2},{dmg:3,dr:3,hp:80},{int:2,wis:1,mp:120}];let b=buffs[Math.floor(Math.random()*buffs.length)];this.state.buffs['v12_'+e.id]={name:e.name,...b,until:Date.now()+240000};result=`獲得暫時加成：${V12.statText(b)}`;}
      this.state.v12=this.state.v12||{encounterSeen:{}}; this.state.v12.encounterSeen[e.id]=(this.state.v12.encounterSeen[e.id]||0)+1;
      this.state.v11=this.state.v11||{}; this.state.v11.encounters=this.state.v11.encounters||[];
      this.state.v11.encounters.unshift({time:Date.now(),name:e.name,type:e.type,map:this.map().name,result}); this.state.v11.encounters=this.state.v11.encounters.slice(0,50);
      this.updateQuest('encounter',1);
      this.log(`<span class="c-purple">奇遇：${e.name}</span> ${e.text}｜${result}`,'green');
    },
    viewGuild(){
      const g=this.state.guild;
      if(!g?.name) return `<h3 class="title">血盟 / 公會 V1.2</h3><div class="small">創建後可捐獻金幣提升血盟等級。V1.2 最高 20 等，新增完整技能樹與門檻效果。</div><button class="btn green" data-create-guild="1">創建血盟 / 公會（100,000 金幣）</button>`;
      const lv=g.level||1, need=lv>=20?0:V12.guildNeed(lv), pct=lv>=20?100:Math.min(100,(g.exp||0)/need*100), bonus=V12.add(V12.guildBonus(lv),this.guildSkillBonus());

      const types=[...new Set(V12.encounters.map(e=>e.type))].map(t=>`<span class="pill">${t}</span>`).join(' ');

window.addEventListener('DOMContentLoaded',()=>{
  Game.init();

  /* === lineage_Idle_V1.3.4 Final EXP Potion Fix: run after Game.init and after every render === */
  (()=>{
    const TITLE='lineage_Idle_V1.3.4';

    function setTitle(){
      document.title=TITLE;
      const start=document.querySelector('#start h1'); if(start) start.textContent=TITLE;
      const top=document.querySelector('.top .title'); if(top) top.textContent=TITLE;
    }

    function isExpPotion(d,it){
      const id=String((d&&d.id)||(it&&it.id)||'').toLowerCase();
      const name=String((d&&d.name)||'');
      return (d&&d.type==='exp_potion') || id.includes('exp') || name.includes('經驗藥水') || !!(d&&d.expBonus) || !!(d&&d.expRate);
    }

    function normalize(){
      if(!window.DB||!DB.items) return;
      Object.entries(DB.items).forEach(([id,d])=>{
        if(isExpPotion(d,{id})){
          d.id=id;
          d.type='exp_potion';
          d.rarity=d.rarity||'紫';
          d.expBonus=Number(d.expBonus||d.expRate||1);
          d.duration=Number(d.duration||10800);
          d.desc=d.desc||`使用後狩獵經驗 +${Math.round(d.expBonus*100)}%`;
        }
      });
    }

    function useExpPotion(key,qty){
      if(!Game.state) return;
      const it=Game.invItem(key);
      const d=it&&DB.items[it.id];
      if(!it||!d||!isExpPotion(d,it)) return;
      qty=Math.max(1,Math.min(Number(qty)||1,it.qty||1));
      d.type='exp_potion';
      const bonus=Number(d.expBonus||d.expRate||1);
      const duration=Number(d.duration||10800);
      const now=Date.now();
      Game.state.expBuff=Game.state.expBuff||null;
      const base=Game.state.expBuff&&Game.state.expBuff.bonus===bonus&&Game.state.expBuff.until>now?Game.state.expBuff.until:now;
      Game.state.expBuff={name:d.name||'經驗藥水',bonus,until:base+duration*1000*qty};
      Game.removeItem(key,qty);
      Game.log(`使用 ${d.name||'經驗藥水'} ×${qty}，狩獵經驗 +${Math.round(bonus*100)}%，時間 +${Math.floor(duration*qty/60)} 分鐘。`,'green');
      Game.save(false);
      Game.render();
    }

    function inject(){
      if(!Game.state) return;
      normalize();
      setTitle();
      Game.state.version='1.2.4';

      const el=document.getElementById('tabContent');
      if(!el || Game.tab!=='inventory') return;

      for(const [key,it] of Object.entries(Game.state.inventory||{})){
        const d=DB.items[it.id];
        if(!isExpPotion(d,it)) continue;

        const name=d.name||'經驗藥水';
        const rows=[...el.querySelectorAll('.item')].filter(row=>row.textContent.includes(name));
        for(const row of rows){
          if(row.querySelector(`[data-force-exp-key="${key}"]`)) continue;
          const spans=row.querySelectorAll('span');
          let target=spans.length?spans[spans.length-1]:row;

          const btn=document.createElement('button');
          btn.className='btn green';
          btn.textContent='使用';
          btn.setAttribute('data-force-exp-key',key);
          btn.style.marginRight='6px';
          btn.onclick=(e)=>{e.preventDefault();e.stopPropagation();useExpPotion(key,1);};
          target.insertBefore(btn,target.firstChild);

          if((it.qty||1)>=10){
            const b10=document.createElement('button');
            b10.className='btn blue';
            b10.textContent='使用10';
            b10.setAttribute('data-force-exp-key',key);
            b10.style.marginRight='6px';
            b10.onclick=(e)=>{e.preventDefault();e.stopPropagation();useExpPotion(key,10);};
            target.insertBefore(b10,btn.nextSibling);
          }

          if((it.qty||1)>1){
            const all=document.createElement('button');
            all.className='btn';
            all.textContent='全部使用';
            all.setAttribute('data-force-exp-key',key);
            all.style.marginRight='6px';
            all.onclick=(e)=>{e.preventDefault();e.stopPropagation();useExpPotion(key,it.qty||1);};
            target.insertBefore(all,btn.nextSibling);
          }
        }
      }
    }

    // Patch useItem as backup.
    const originalUseItem=Game.useItem.bind(Game);
    Game.useItem=function(key){
      const it=this.invItem(key), d=it&&DB.items[it.id];
      if(isExpPotion(d,it)) return useExpPotion(key,1);
      return originalUseItem(key);
    };

    // Patch kill for actual bonus.
    const originalKill=Game.kill.bind(Game);
    Game.kill=function(mdef){
      originalKill(mdef);
      const b=this.state&&this.state.expBuff;
      if(!b || !b.until || Date.now()>b.until){ if(this.state) this.state.expBuff=null; return; }
      const add=Math.floor((mdef&&mdef.exp||0)*(b.bonus||0));
      if(add>0){
        this.state.exp+=add;
        this.levelUp();
        this.blog(`經驗藥水加成 EXP +${add}`);
        this.syncVitals&&this.syncVitals();
      }
    };

    // Patch renderTab as backup, but interval is the main guarantee.
    const originalRenderTab=Game.renderTab.bind(Game);
    Game.renderTab=function(){
      originalRenderTab();
      setTimeout(inject,0);
      setTimeout(inject,50);
    };

    inject();
    setInterval(inject,500);
  })();
});



/* === lineage_Idle_V1.2.11 Rebuilt Sell Rules ===
   重新建立販售規則：
   1) 卷軸不進入任何自動 / 批次 / 智能清理規則。
   2) 卷軸可以在背包單件手動賣出。
   3) 不再使用舊 sellInventoryKey(force=false) 規則。
   4) 所有背包賣出按鈕統一改用 data-manual-sell。
*/
(()=>{
  if(!window.Game||!window.DB) return;
  const VERSION='lineage_Idle_V1.2.11';
  const EQUIP_TYPES=['weapon','helmet','tshirt','armor','cloak','gloves','boots','leggings','ring','earring','amulet','belt'];
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=n=>Math.max(0,Math.floor(Number(n)||0)).toLocaleString();
  const isEquip=d=>!!d&&EQUIP_TYPES.includes(d.type);
  const eqSet=()=>new Set(Object.values(Game.state?.equip||{}).filter(Boolean));

  function setVersion(){
    document.title=VERSION;
    const start=document.querySelector('#start h1'); if(start) start.textContent=VERSION;
    const top=document.querySelector('.top .title'); if(top) top.textContent=VERSION;
    document.querySelectorAll('.title').forEach(el=>{
      if(String(el.textContent||'').includes('lineage_Idle')) el.textContent=VERSION;
    });
  }

  function sellPrice(key){
    const it=Game.state?.inventory?.[key]; if(!it) return 0;
    const d=DB.items[it.id]||{};
    const qty=Math.max(1,Number(it.qty)||1);
    const ench=Math.max(0,Number(it.enchant)||0);
    return Math.max(1,Math.floor((Number(d.price)||100)*(0.35+ench*0.2)))*qty;
  }

  function manualSell(key,{silent=false}={}){
    if(!Game.state) return 0;
    const inv=Game.state.inventory||{};
    const it=inv[key];
    if(!it){ if(!silent) Game.log?.('販售失敗：背包內找不到該物品。','red'); return 0; }
    if(eqSet().has(key)){ if(!silent) alert('已裝備中的物品不能賣出，請先卸下。'); return 0; }
    const d=DB.items[it.id]||{name:it.id};
    const qty=Math.max(1,Number(it.qty)||1);
    const gain=sellPrice(key);
    Game.state.adena=(Number(Game.state.adena)||0)+gain;
    delete inv[key];
    if(!silent) Game.log?.(`賣出 ${d.name||it.id}${qty>1?' ×'+qty:''}，獲得 ${money(gain)} 金幣。`,'green');
    Game.save?.(false);
    return gain;
  }

  // 統一公開販售 API：手動賣出永遠不套規則。
  Game.getSellPriceByKey=function(key){return sellPrice(key);};
  Game.sellInventoryKey=function(key,{silent=false}={}){return manualSell(key,{silent});};
  Game.sellItem=function(key){manualSell(key,{silent:false}); this.render?.();};

  // 重新建立智能清理規則：卷軸永遠 false。
  Game.isSellRuleMatched=function(key){
    const it=this.state?.inventory?.[key]; if(!it) return false;
    const d=DB.items[it.id]||{};
    if(eqSet().has(key)) return false;
    if(d.type==='scroll') return false;
    const limit=Math.max(0,Number(this.state?.settings?.sellEnchantLimit)||0);
    if(d.type==='book') return !!this.state?.skills?.[d.skill];
    if(isEquip(d)) return (Number(it.enchant)||0)<=limit;
    return false;
  };

  Game.sellByCurrentRule=function({silent=false}={}){
    let count=0,total=0;
    for(const key of Object.keys(this.state?.inventory||{})){
      const it=this.state.inventory[key], d=DB.items[it?.id]||{};
      if(d.type==='scroll') continue;
      if(!this.isSellRuleMatched(key)) continue;
      count+=Math.max(1,Number(it.qty)||1);
      total+=manualSell(key,{silent:true});
    }
    if(!silent) this.log?.(count?`智能清理完成：賣出 ${count} 件，獲得 ${money(total)} 金幣。`:'智能清理完成：沒有符合規則的可售出物品。',count?'green':undefined);
    this.render?.();
    return {count,total};
  };

  Game.sellWhite=function(){
    let count=0,total=0;
    for(const key of Object.keys(this.state?.inventory||{})){
      const it=this.state.inventory[key], d=DB.items[it?.id]||{};
      if(eqSet().has(key) || d.type==='scroll') continue;
      if(!(d.rarity==='白' && ['weapon','helmet','tshirt','armor','cloak','gloves','boots','leggings'].includes(d.type))) continue;
      count+=Math.max(1,Number(it.qty)||1);
      total+=manualSell(key,{silent:true});
    }
    if(count>0) this.log?.(`自動販售完成：白色未裝備裝備 ${count} 件，獲得 ${money(total)} 金幣。`,'green');
    return {count,total};
  };
  Game.smartSell=Game.sellByCurrentRule;
  Game.autoClean=Game.sellByCurrentRule;

  Game.batchSell=function(mode){
    let count=0,total=0;
    for(const key of Object.keys(this.state?.inventory||{})){
      const it=this.state.inventory[key], d=DB.items[it?.id]||{};
      if(eqSet().has(key) || d.type==='scroll') continue;
      let ok=false;
      if(mode==='white') ok=d.rarity==='白' && isEquip(d);
      if(mode==='unequipped') ok=isEquip(d);
      if(mode==='dupeBooks') ok=d.type==='book' && this.state?.skills?.[d.skill];
      if(mode==='trash') ok=d.type==='material';
      if(!ok) continue;
      count+=Math.max(1,Number(it.qty)||1);
      total+=manualSell(key,{silent:true});
    }
    this.log?.(count?`批次販售完成：賣出 ${count} 件，獲得 ${money(total)} 金幣。`:'批次販售完成：沒有符合規則的可售出物品。',count?'green':undefined);
    this.render?.();
  };

  // 經驗值降低：覆蓋 kill，不再使用舊版 *3。
  Game.kill=function(mdef){
    const m=this.map();
    const ad=this.rand(mdef.adena[0],mdef.adena[1]);
    const baseExp=Number(mdef.exp)||0;
    const expGain=Math.max(1,Math.floor(baseExp*0.15));
    this.state.adena+=ad;
    this.state.exp+=expGain;
    this.blog(`擊敗 ${mdef.name}，EXP +${expGain}，金幣 +${ad}`);
    m.drops.forEach(d=>{
      if(Math.random()*100<d.rate){
        this.addItem(d.id,1,0);
        this.log('獲得道具：'+(DB.items[d.id]?.name||d.id),'green');
      }
    });
    this.levelUp();
    this.storyEncounter(mdef);
    this.state.monster=null;
    if(this.state.settings?.autoSell) this.sellWhite();
  };

  Game.viewInventory=function(){
    const inv=this.state?.inventory||{};
    const eq=eqSet();
    const rows=Object.entries(inv).sort((a,b)=>{
      const da=DB.items[a[1].id]||{}, db=DB.items[b[1].id]||{};
      return String(da.type||'').localeCompare(String(db.type||''),'zh-Hant') || String(da.name||'').localeCompare(String(db.name||''),'zh-Hant');
    }).map(([key,it])=>{
      const d=DB.items[it.id]||{};
      const isEq=eq.has(key);
      const buttons=[];
      if(isEquip(d)&&!isEq) buttons.push(`<button class="btn green" data-equip="${esc(key)}">裝備</button>`);
      if(isEquip(d)&&!isEq) buttons.push(`<button class="btn" data-enchant="${esc(key)}">強化</button>`);
      if(d.type==='potion'||d.type==='book'||d.type==='exp_potion') buttons.push(`<button class="btn green" data-use="${esc(key)}">使用</button>`);
      if(!isEq) buttons.push(`<button class="btn red" data-manual-sell="${esc(key)}">賣出</button>`);
      else buttons.push('<span class="pill">裝備中</span>');
      const nm=this.itemName?this.itemName(key):`${Number(it.enchant)||0?`+${Number(it.enchant)} `:''}${d.name||it.id}${Number(it.qty)>1?' ×'+it.qty:''}`;
      const type=this.typeName?this.typeName(d.type):(d.type||'物品');
      const ruleTag=d.type==='scroll'?'<span class="pill c-gold">卷軸：不列入規則，可手動賣出</span>':(this.isSellRuleMatched(key)?'<span class="pill c-red">符合智能清理</span>':'');
      return `<div class="item row"><span><b class="rarity-${esc(d.rarity||'白')}">${esc(nm)}</b> ${ruleTag}<br><span class="small">${esc(type)}｜${esc(d.rarity||'白')}｜販售 ${money(sellPrice(key))} 金幣</span></span><span>${buttons.join(' ')}</span></div>`;
    }).join('') || '<div class="small">背包是空的</div>';
    const panel=`<div class="setting-card" style="margin-bottom:10px"><b class="c-gold">V1.2.11 重新建立販售規則</b><div class="row" style="flex-wrap:wrap;justify-content:flex-start;margin-top:8px"><button class="btn red" data-batch-sell="white">販售白色未裝備</button><button class="btn red" data-batch-sell="dupeBooks">販售已學技能書</button><button class="btn red" data-batch-sell="unequipped">販售全部未裝備裝備</button><button class="btn red" data-smart-clean="1">智能清理</button></div><div class="small">卷軸完全不進入自動、批次、智能清理規則；卷軸只會保留在背包，需單件手動賣出。</div></div>`;
    return `<h3 class="title">背包</h3>${panel}${rows}`;
  };

  const oldRenderTab=Game.renderTab?.bind(Game);
  Game.renderTab=function(){
    if(oldRenderTab) oldRenderTab();
    setVersion();
    const el=document.getElementById('tabContent');
    if(!this.state||!el) return;
    if(this.tab==='inventory') el.innerHTML=this.viewInventory();
    // 全部移除舊販售入口，只保留新手動販售入口。
    el.querySelectorAll('[data-sell]').forEach(btn=>btn.removeAttribute('data-sell'));
    el.querySelectorAll('[data-sell-rule],[data-sell-all],[data-batch-sell-rule],[data-batch-quick]').forEach(btn=>btn.remove());
    el.querySelectorAll('[data-manual-sell]').forEach(btn=>btn.onclick=e=>{e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); this.sellItem(btn.dataset.manualSell);});
    el.querySelectorAll('[data-batch-sell]').forEach(btn=>btn.onclick=e=>{e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); this.batchSell(btn.dataset.batchSell);});
    el.querySelectorAll('[data-smart-clean]').forEach(btn=>btn.onclick=e=>{e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); this.sellByCurrentRule({silent:false});});
    el.querySelectorAll('[data-equip]').forEach(btn=>btn.onclick=()=>this.equip(btn.dataset.equip));
    el.querySelectorAll('[data-use]').forEach(btn=>btn.onclick=()=>this.useItem(btn.dataset.use));
    el.querySelectorAll('[data-enchant]').forEach(btn=>btn.onclick=()=>this.enchant(btn.dataset.enchant));
  };

  // 防止任何殘留程式碼輸出舊規則訊息。
  const oldLog=Game.log?.bind(Game);
  if(oldLog){
    Game.log=function(msg,color){
      const t=String(msg??'');
      if(t.includes('未賣出') && t.includes('目前規則')) return;
      return oldLog(msg,color);
    };
  }

  const oldMigrate=Game.migrateState?.bind(Game);
  Game.migrateState=function(){
    if(oldMigrate) oldMigrate();
    if(this.state){
      this.state.version='1.2.11';
      this.state.settings=this.state.settings||{};
      delete this.state.settings.sellRarity;
      delete this.state.settings.sellType;
      delete this.state.settings.sellFilter;
    }
    setVersion();
  };

  setVersion();
})();

        <div class="setting-card">

          <label class="row item"><span>購買藥水</span><select data-setting="autoBuyPotionId">${potionIds.map(id=>`<option value="${id}" ${s.autoBuyPotionId===id?'selected':''}>${DB.items[id].name}</option>`).join('')}</select></label>
          <label class="row item"><span>補到數量</span><input data-setting="autoBuyPotionQty" type="number" min="1" max="999" value="${s.autoBuyPotionQty||50}" style="width:90px"></label>
